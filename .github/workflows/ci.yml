# Littlelight CI (docs/plans/step-1.md task 1.10; PRD "Build order" step 1: "CI builds every image").
#
#   check            install (frozen lockfile), lint, a no-metadata grep over the worker source,
#                    the step-6/7 AI hygiene greps (.github/scripts/ai-hygiene.sh: no provider key
#                    names in the client/shared, no provider SDK, no dataKey in the AI pipeline,
#                    no ANTHROPIC_API_KEY in the api, no search_text in the chat/search/shared API
#                    code), the step-8 sharing hygiene greps (.github/scripts/share-hygiene.sh:
#                    exactly two withServiceRole call sites in the sharing api, no GPS/data key/
#                    notes/people in the auto-sharer), the step-9 native hygiene checks
#                    (.github/scripts/native-hygiene.sh: no signing material, APNs .p8, Firebase
#                    config or private key in git, no web-storage token writes in the platform
#                    layer, Capacitor loggingBehavior "none", no console.log/debug in native
#                    code), typecheck (workspace + e2e/, incl. e2e/native), unit tests
#                    (incl. packages/ai adapters against local mock servers), integration tests
#                    (db-integration: RLS matrix, search + chat + sharing tables etc.;
#                    api-integration: auth, invites, babies, uploads, photos, search, chat, share
#                    links + viewer via Fastify inject with a stubbed GoTrue and S3 and the fake
#                    chat model / embedder; worker-integration: ingest, purge, sweep, the AI batch
#                    pipeline, the search indexer and the auto-sharer with the in-process fake
#                    provider against a standalone MinIO) on a pgvector service container (auth.* is
#                    stubbed by the test harness) with a guard that fails the job if any project
#                    or named suite silently skipped, a generated-DB-types drift check against a
#                    database migrated in production order (bootstrap -> GoTrue migrate -> app
#                    migrations), and `docker compose config` for both files plus a canary check
#                    of which services receive which provider key.
#   images           builds every production image (api, worker, web, migrate) with buildx + GHA
#                    cache. Nothing is pushed.
#   dev-stack-smoke  brings up docker-compose.dev.yml from a clean checkout (no .env, the step-1
#                    check), then pins api + worker to the keyless fake AI provider with a CI-only
#                    project .env (VISION_PROVIDER=fake; no provider key exists in CI) and runs
#                    e2e/smoke/dev-stack.sh (step-1..8 acceptance checks), then the Playwright
#                    e2e suite (step-3 auth, step-4 upload, step-5 timeline edits, step-7 search
#                    and chat, step-8 sharing specs; the demo family is seeded by `migrate` via
#                    .env.dev SEED_DEMO_FAMILY=true) in Chromium, then the step-4 upload gate
#                    (docs/plans/step-4.md 4.1: `pnpm e2e:upload-gate`), then the step-5 perf gate
#                    (docs/plans/step-5.md 4.1: `pnpm perf:seed` + `PERF_CI=1 pnpm e2e:perf`),
#                    then the step-6 AI gate (docs/plans/step-6.md 4.1: `pnpm e2e:ai-gate
#                    --provider fake`), then the step-7 search gate (docs/plans/step-7.md 4.1:
#                    `pnpm e2e:search-gate --provider fake --count 2000`), then the step-8 share
#                    gate (docs/plans/step-8.md 4.1: `pnpm e2e:share-gate`) and the step-8 log
#                    scan of api + worker for share tokens, passcodes, presign signatures and
#                    GPS (docs/plans/step-8.md 4.5), then the step-9 push gate (docs/plans/
#                    step-9.md 2.15: `pnpm e2e:push-gate`, fake push provider) with a log tap
#                    across its api/worker recreations and a scan of those logs for device
#                    tokens, JWTs, bearer values and presign parts.
#   android-debug    step-9 Android debug build on every push/PR (docs/plans/step-9.md 2.14):
#                    JDK 21 and the Android SDK from the runner image, `native:sync:android`,
#                    `android:build:debug` (assembleDebug) + lintDebug, then the merged-manifest
#                    forbidden-permission / allowBackup check. Debug key only: no
#                    google-services.json, no signing secrets, no emulator.
#   ios-sim-build    step-9 iOS Simulator build, manual only (`workflow_dispatch`; macOS minutes
#                    cost ~10x): `native:sync:ios` + `ios:build:sim` (ad-hoc signed, no team or
#                    certificate) + plist lint. The native gates (`pnpm e2e:native-ios`,
#                    `pnpm e2e:native-android`) need a simulator / an HVF/KVM emulator and run
#                    locally only (docs/plans/step-9.md 4.4, 4.5); no store upload runs in CI.
#
# No secrets are needed or read. Every third-party action is pinned to a full commit SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run: everything above plus the iOS Simulator build (ios-sim-build runs only here).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  FORCE_COLOR: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    # Step 9: 2,532 unit tests (~30 s locally) and 1,249 integration tests (~130 s locally,
    # roughly 2-3x on a hosted runner) plus install, lint, typecheck, types drift.
    timeout-minutes: 25
    services:
      db:
        # Same image as both Compose files.
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: littlelight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d littlelight"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # docs/plans/step-4.md 4.4: no sharp/exif call that could carry metadata into a derivative
      # may appear anywhere in the worker source (tests included; the fixture writer and the
      # lint-style no-metadata.test.ts avoid the literals). grep exits 0 on a match and 2 on an
      # error (e.g. the folder moved), so only exit 1 passes.
      - name: No metadata-preserving calls in the worker
        run: |
          set -uo pipefail
          test -d apps/worker/src/ingest || { echo "::error::apps/worker/src/ingest is missing"; exit 1; }
          grep -rnE 'withMetadata|keepExif|keepMetadata|keepIccProfile|withIccProfile|withExif' apps/worker/src
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::metadata-preserving call found in apps/worker/src (see above)"
            exit 1
          fi
          [ "$rc" -eq 1 ] || { echo "::error::grep failed (exit $rc)"; exit 1; }

      # docs/plans/step-6.md 4.4 / 2.10 and step-7.md 2.11 / 4.5: provider keys never in
      # apps/mobile-web/src or packages/shared/src, no provider SDK in apps/, packages/ or the
      # lockfile, no dataKey in apps/worker/src/ai, no ANTHROPIC_API_KEY in apps/api/src, no
      # search_text in packages/shared/src/api or the api's chat/search code. Same script runs
      # locally.
      - name: AI hygiene (keys, provider SDKs, data key, search document)
        run: bash .github/scripts/ai-hygiene.sh

      # docs/plans/step-8.md 2.11 / 4.5: exactly two withServiceRole call sites in
      # apps/api/src/sharing (token exchange, viewer sign-out; *.test.ts and comments excluded),
      # and no gps_lat_enc / gps_lng_enc / decrypt_coord / dataKey / .note / .people in
      # apps/worker/src/sharing. Same script runs locally.
      - name: Sharing hygiene (service_role call sites, no GPS or private text in auto-share)
        run: bash .github/scripts/share-hygiene.sh

      # docs/plans/step-9.md 9.16 / 2.14: no signing material (.p8, .p12, .jks, .keystore,
      # provisioning profiles, keystore.properties), google-services.json /
      # GoogleService-Info.plist or private-key body in git; apps/mobile-web/src/platform never
      # writes a token to web storage (allow-list .github/scripts/native-storage-allowlist.txt);
      # capacitor.config.ts loggingBehavior "none"; no console.log/debug in
      # apps/mobile-web/src/platform/native. Same script runs locally.
      - name: Native hygiene (signing material, web storage, Capacitor logging)
        run: bash .github/scripts/native-hygiene.sh

      - name: Typecheck
        run: pnpm typecheck

      # e2e/ is not a workspace package and has no tsconfig, so `pnpm typecheck` skips it. Same
      # module settings as the workspace packages; `--types node` because the specs read
      # process.env. Shell globs: a renamed folder fails loudly (tsc: file not found).
      # e2e/helpers/*.ts covers e2e/helpers/native.ts and e2e/helpers/reset.ts; e2e/native/*.ts
      # are the step-9 push, Android and invite-link gate scripts (the XCUITest project under
      # e2e/native/ios-uitest is Swift and is built by Xcode, not here). global-setup/teardown
      # are the Playwright globalSetup/globalTeardown hooks referenced by playwright.config.ts.
      - name: Typecheck e2e
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler
          --target es2022 --strict --types node
          e2e/auth/*.ts e2e/upload/*.ts e2e/helpers/*.ts e2e/timeline/*.ts e2e/perf/*.ts e2e/ai/*.ts
          e2e/search/*.ts e2e/chat/*.ts e2e/sharing/*.ts e2e/fixtures/*.ts e2e/native/*.ts
          e2e/playwright.config.ts e2e/playwright.perf.config.ts
          e2e/global-setup.ts e2e/global-teardown.ts

      - name: Unit tests
        run: pnpm test

      # Standalone MinIO for the worker-integration project (docs/plans/step-4.md 2.11). Not a
      # service container: those cannot set a command, and MinIO needs `server /data`. Same
      # image pin as both Compose files; root credentials are the dev-only pair from
      # docker-compose.dev.yml x-dev-shared. The worker harness creates the bucket and enables
      # versioning itself. The runner is discarded after the job, so no teardown is needed.
      - name: Start MinIO (standalone)
        env:
          MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          MINIO_ROOT_USER: dev
          MINIO_ROOT_PASSWORD: devdevdev
        run: |
          set -euo pipefail
          docker run -d --name ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            "$MINIO_IMAGE" server /data
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs ci-minio
          echo "::error::MinIO did not become live on http://localhost:9000"
          exit 1

      # db-integration + api-integration + worker-integration (vitest.config.ts). Every
      # integration suite is `describe.skipIf(...)` on DATABASE_URL (worker: and S3_ENDPOINT), and
      # Vitest exits 0 when everything is skipped, so the JSON report is checked afterwards: each
      # project must have executed tests and no test file may be skipped entirely
      # (.github/scripts/check-integration-report.mjs).
      - name: Integration tests (pgvector service + MinIO)
        env:
          # Dev-only values of the throwaway service container above (same as docker-compose.dev.yml
          # x-dev-shared). Tests connect as the superuser for fixtures and as littlelight_api /
          # littlelight_worker for the RLS cases and the API's request pool.
          DATABASE_URL: postgres://postgres:dev@localhost:5432/littlelight
          AUTH_DB_PASSWORD: dev
          API_DB_PASSWORD: dev
          WORKER_DB_PASSWORD: dev
          DATA_ENCRYPTION_KEY: dev-only-data-encryption-key-32-chars-min
          SEED_DEMO_FAMILY: "true"
          # API auth/mail settings (docs/plans/step-3.md 2.8, dev values from x-dev-shared). The
          # api-integration harness builds its config with testConfig() (same literals) and
          # stubs GoTrue and the mailer, so nothing listens on these; they are set so a test
          # that loads config from process.env gets the dev values rather than failing.
          JWT_SECRET: dev-only-jwt-secret-at-least-32-characters
          PUBLIC_URL: http://localhost:8080
          AUTH_INTERNAL_URL: http://localhost:9999
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          MAIL_FROM: noreply@littlelight.local
          # worker-integration (apps/worker/src/testing/harness.ts): the MinIO started above,
          # root credentials (bucket create + versioning + ListObjectVersions). A dedicated test
          # bucket, as in docs/plans/step-4.md 4.4. S3_PUBLIC_ENDPOINT only matters to a test
          # that loads the API config from process.env.
          S3_ENDPOINT: http://localhost:9000
          S3_PUBLIC_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: dev
          S3_SECRET_KEY: devdevdev
          S3_BUCKET: littlelight-test
          S3_REGION: us-east-1
          S3_FORCE_PATH_STYLE: "true"
          # Step-6/7 AI suites (docs/plans/step-6.md 2.10/4.4, step-7.md 2.12): the worker
          # pipeline and search-index tests build the fake describer / embedder in-process and
          # the api search/chat tests inject the fake chat model + embedder, so none reads a key;
          # this pins any config loaded from process.env to the keyless provider too. CI has no
          # provider keys and never will.
          VISION_PROVIDER: fake
          # Step-8 sharing suites (docs/plans/step-8.md 2.12): the api harness builds its config
          # with testConfig(); the defaults are pinned here for any config read from process.env.
          SHARE_MEDIA_URL_TTL_SEC: "300"
          SHARE_RECONCILE_CRON: "41 * * * *"
          # Step-9 push / native suites (docs/plans/step-9.md 2.15): the worker notify tests
          # inject the fake sender and the api harness builds its config with testConfig();
          # the dev defaults are pinned for any config read from process.env. No APNs/FCM
          # credential exists in CI. REVIEW_ACCOUNT_* is deliberately unset (off by default);
          # apps/api/src/auth/review.integration.test.ts sets and clears it itself.
          PUSH_PROVIDER: fake
          NATIVE_APP_ORIGINS: capacitor://localhost,https://localhost
          REPORT: ${{ runner.temp }}/integration-report.json
        run: |
          set -euo pipefail
          pnpm test:integration \
            --reporter=default --reporter=github-actions \
            --reporter=json --outputFile.json="$REPORT"
          # Project dirs, plus the step-6 AI, step-7 search/chat, step-8 sharing and step-9
          # push / review-account / demo-media suites by name so a rename cannot drop them
          # silently.
          node .github/scripts/check-integration-report.mjs "$REPORT" \
            packages/db apps/api apps/worker \
            packages/db/ai-pipeline.integration.test.ts \
            packages/db/set-plan.integration.test.ts \
            apps/api/src/photos/ai.integration.test.ts \
            apps/worker/src/ai/pipeline.integration.test.ts \
            packages/db/search-chat.integration.test.ts \
            apps/api/src/search/search.integration.test.ts \
            apps/api/src/chat/chat.integration.test.ts \
            apps/worker/src/ai/search-index.integration.test.ts \
            packages/db/sharing.integration.test.ts \
            apps/api/src/sharing/admin.integration.test.ts \
            apps/api/src/sharing/viewer.integration.test.ts \
            apps/worker/src/sharing/autoshare.integration.test.ts \
            packages/db/push.integration.test.ts \
            packages/db/review-family.integration.test.ts \
            apps/api/src/routes/push.integration.test.ts \
            apps/api/src/auth/review.integration.test.ts \
            apps/api/src/sharing/viewer.push.integration.test.ts \
            apps/worker/src/push/notify.integration.test.ts \
            apps/worker/src/demo/media.integration.test.ts

      - name: MinIO logs
        if: failure()
        run: docker logs ci-minio 2>&1 | tail -n 200 || true

      # packages/db/src/generated is committed; fail if it no longer matches the migrations.
      # Uses a separate database migrated exactly like Compose does it (roles + auth schema,
      # then GoTrue's own migrations, then ours), so test leftovers and the auth.users stub
      # cannot affect it.
      - name: Generated DB types are current
        env:
          DB_SERVICE: ${{ job.services.db.id }}
          DATABASE_URL: postgres://postgres:dev@localhost:5432/littlelight_types
          AUTH_DB_PASSWORD: dev
          API_DB_PASSWORD: dev
          WORKER_DB_PASSWORD: dev
          # Same pin as both Compose files.
          GOTRUE_IMAGE: supabase/auth:v2.197.0
        run: |
          set -euo pipefail
          docker exec "$DB_SERVICE" createdb -U postgres littlelight_types
          pnpm db:bootstrap
          docker run --rm --network host \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@localhost:5432/littlelight_types" \
            -e GOTRUE_JWT_SECRET=dev-only-jwt-secret-at-least-32-characters \
            -e GOTRUE_SITE_URL=http://localhost:8080 \
            -e API_EXTERNAL_URL=http://localhost:8080/auth \
            "$GOTRUE_IMAGE" auth migrate
          pnpm db:migrate
          pnpm --filter @littlelight/db db:types
          git diff --exit-code -- packages/db/src/generated
          test -z "$(git status --porcelain -- packages/db/src/generated)" \
            || { echo "untracked generated files:"; git status --porcelain -- packages/db/src/generated; exit 1; }

      - name: Validate Compose files
        run: |
          set -euo pipefail
          docker compose version
          docker compose -f docker-compose.dev.yml config -q
          # Production needs a .env and the required bind-mount paths; use the documented
          # placeholders and throwaway directories (config -q only interpolates, it starts nothing).
          cp .env.example .env
          STORAGE_PATH="$RUNNER_TEMP/storage" BACKUP_PATH="$RUNNER_TEMP/backups" \
            docker compose -f docker-compose.yml config -q
          rm -f .env

      # Provider-key placement (docs/plans/step-7.md 2.11): OPENAI_API_KEY reaches worker + api,
      # ANTHROPIC_API_KEY the worker only, neither reaches migrate/web/anything else. Rendered
      # with throwaway canary values (not secrets; .github/scripts/check-compose-keys.mjs prints
      # service names only): dev via a temporary .env.local (its env_file), production via the
      # shell environment (x-app-env interpolation). The checkout has neither file; both are
      # removed again.
      - name: Provider keys reach only the allowed services (canary)
        env:
          CANARY_OPENAI: ci-canary-openai-key-not-a-secret
          CANARY_ANTHROPIC: ci-canary-anthropic-key-not-a-secret
        run: |
          set -euo pipefail
          test ! -e .env.local && test ! -e .env
          trap 'rm -f .env.local .env' EXIT
          printf 'OPENAI_API_KEY=%s\nANTHROPIC_API_KEY=%s\n' "$CANARY_OPENAI" "$CANARY_ANTHROPIC" > .env.local
          docker compose -f docker-compose.dev.yml config --format json \
            | node .github/scripts/check-compose-keys.mjs dev
          rm -f .env.local
          cp .env.example .env
          OPENAI_API_KEY="$CANARY_OPENAI" ANTHROPIC_API_KEY="$CANARY_ANTHROPIC" \
            STORAGE_PATH="$RUNNER_TEMP/storage" BACKUP_PATH="$RUNNER_TEMP/backups" \
            docker compose -f docker-compose.yml config --format json \
            | node .github/scripts/check-compose-keys.mjs prod

  images:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile
            target: prod
          - image: worker
            file: apps/worker/Dockerfile
            target: prod
          - image: web
            file: apps/mobile-web/Dockerfile
            target: prod
          # Single-purpose image: its final (unnamed) stage is the production image.
          - image: migrate
            file: packages/db/Dockerfile
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Path context (repo root, filtered by .dockerignore), same as both Compose files.
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: littlelight-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  dev-stack-smoke:
    name: Dev stack smoke + e2e
    runs-on: ubuntu-24.04
    # Image builds + up (~10 min cold), fake-provider recreate of api + worker (~1 min), smoke,
    # Chromium download, e2e with one retry, five api restarts, upload gate (~3-4 min), perf
    # seed + perf run on two viewports (~2-4 min), AI gate (~1 min, capped at 10), search gate
    # (2,000-photo seed + 50 search and 50 chat queries, a few minutes, capped at 15), share gate
    # + log scan (~1-2 min, capped at 15), push gate + log scan (~3-5 min, capped at 15).
    timeout-minutes: 130
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Zero-setup precondition (no env files to create)
        run: test ! -e .env && test ! -e .env.local

      # Explicit so build/start failures surface in their own step (SMOKE_SKIP_UP=1 below).
      # Nothing is installed on the host before this, so the stack starts from a fresh clone.
      - name: Start dev stack
        run: docker compose -f docker-compose.dev.yml up -d --build --wait --wait-timeout 600

      # From here on the stack runs the keyless fake AI provider, like a dev machine with the
      # git-ignored project .env `VISION_PROVIDER=fake`: the smoke's step-7 chat check and the
      # chat/search e2e specs need a chat model, and CI has no provider key (the compose default
      # `openai` without a key means "AI disabled; chat unavailable"). A project .env (Compose
      # interpolation only, never passed to containers) rather than a step/job env var, because
      # the AI and search gates deliberately drop VISION_PROVIDER from their environment when
      # they restore api/worker "to the stack default": with this file that default is `fake`
      # for every later compose call. Written after the zero-setup start above, so that start
      # still proves a fresh clone needs no env file.
      - name: Pin api + worker to the keyless fake provider (CI-only project .env)
        run: |
          set -euo pipefail
          printf '# CI only (not committed): keyless fake AI provider for the gates.\nVISION_PROVIDER=fake\n' > .env
          docker compose -f docker-compose.dev.yml up -d --no-deps --wait --wait-timeout 180 api worker
          for svc in api worker; do
            ok=""
            for _ in $(seq 1 30); do
              # Captured first: `logs | grep -q` can SIGPIPE the producer, failing under pipefail.
              log="$(docker compose -f docker-compose.dev.yml logs --no-color "$svc" 2>&1 || true)"
              if grep -q 'AI enabled: provider=fake' <<<"$log"; then
                ok=1
                break
              fi
              sleep 2
            done
            [ -n "$ok" ] || { echo "::error::$svc did not log 'AI enabled: provider=fake'"; exit 1; }
          done
          key="$(docker compose -f docker-compose.dev.yml exec -T worker printenv OPENAI_API_KEY || true)"
          if [ -n "$(printf '%s' "$key" | tr -d '[:space:]')" ]; then
            echo "::error::worker has an OPENAI_API_KEY in CI"
            exit 1
          fi
          echo "api + worker on the fake provider, no provider key"

      - name: Smoke test (step-1..8 acceptance checks)
        env:
          SMOKE_SKIP_UP: "1"
        run: bash e2e/smoke/dev-stack.sh

      # Host-side tooling for Playwright. The containers bind-mount only src/ folders, so the
      # host node_modules (glibc) never reaches them.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version (from the lockfile)
        id: playwright
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^  playwright@([0-9][^:(]*):.*/\1/p' pnpm-lock.yaml | head -n1)"
          test -n "$version" || { echo "::error::playwright not found in pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restore/save split so the browser cache is saved even when the e2e run fails.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # Always run: on a cache hit it skips the download but still installs the OS packages.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # The API's sign-in-code limit is in memory, 30 per hour per IP (docs/plans/step-3.md 2.9),
      # and every request here comes from the same IP. The smoke spends some, one e2e run ~19
      # (more with the CI retry), so reset the counter with a restart (script header).
      - name: Reset API rate limits (restart api)
        run: bash .github/scripts/restart-api.sh

      - name: e2e (Playwright, PRD step-3..8 specs)
        env:
          # e2e/playwright.config.ts: retries 1 and HTML report on CI.
          CI: "1"
        run: pnpm e2e

      # The Playwright run may have used most of the hourly sign-in-code budget.
      - name: Reset API rate limits again (restart api)
        run: bash .github/scripts/restart-api.sh

      # PRD step-4 check (docs/plans/step-4.md 4.1, e2e/upload/gate.ts): 200-file bulk upload
      # through the API + presigned MinIO multipart, duplicates, HEIC, thumb p95 < 5 s, no GPS in
      # derivatives, purge. Talks to the published ports (8080, 8025, 9000 with the dev root
      # key) and shells out to `docker compose -f docker-compose.dev.yml exec` (db, worker) and
      # `docker run alpine:3.22` (apk add exiftool, needs network). GATE_UPLOAD_RATE and
      # INGEST_CONCURRENCY stay at their defaults. ~1-2 min of setup plus ~70 s of paced
      # uploads; the step timeout bounds a hang.
      - name: Upload gate (PRD step-4 check)
        timeout-minutes: 15
        env:
          GATE_LOG: ${{ runner.temp }}/upload-gate/gate.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$GATE_LOG")"
          pnpm e2e:upload-gate 2>&1 | tee "$GATE_LOG"

      # The perf spec signs demo-mom in once per project (OTP via Mailpit); the gate above spent
      # more of the hourly sign-in-code budget.
      - name: Reset API rate limits before perf (restart api)
        run: bash .github/scripts/restart-api.sh

      # PRD step-5 check, "10,000 seeded photos scroll smoothly" (docs/plans/step-5.md 4.1).
      # The seed runs on the runner host (apps/worker/src/tools/perf-seed.ts: superuser + MinIO
      # root key, refuses any non-localhost target) against the dev stack's published ports; the
      # values are the dev-only literals of docker-compose.dev.yml x-dev-shared, the same the
      # upload gate uses. Idempotent; expects photos=10000 photo_derivatives=20000.
      - name: Perf seed (10,000 photos, dev only)
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/littlelight
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: dev
          S3_SECRET_KEY: devdevdev
          S3_BUCKET: littlelight-dev
          S3_REGION: us-east-1
        run: pnpm perf:seed

      # Playwright frame timing / long tasks / DOM bounds / API p95 on the phone and desktop
      # projects (e2e/playwright.perf.config.ts). PERF_CI=1 selects the shared-runner thresholds
      # (jank 15 %, p95 34 ms, max frame 600 ms, long tasks 40, API p95 800 ms; DOM bounds
      # unchanged). The per-project table stays in the log and is copied to the job summary.
      - name: Perf gate (PRD step-5 check)
        timeout-minutes: 15
        env:
          PERF_CI: "1"
          PERF_LOG: ${{ runner.temp }}/perf/perf.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PERF_LOG")"
          rc=0
          pnpm e2e:perf 2>&1 | tee "$PERF_LOG" || rc=$?
          {
            echo '### Timeline perf (PERF_CI thresholds)'
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' "$PERF_LOG" \
              | awk '/^Timeline perf \[/{on=1} on && /^(Timeline perf \[|  [A-Za-z])/{print; next} {on=0}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      # The AI gate signs a fresh user in (OTP via Mailpit); the perf gate spent more of the
      # hourly sign-in-code budget.
      - name: Reset API rate limits before the AI gate (restart api)
        run: bash .github/scripts/restart-api.sh

      # PRD step-6 check, "50 sample photos produce schema-valid JSON; ai_batches.cost_usd
      # recorded; free-tier photos are never submitted" (docs/plans/step-6.md 4.1, e2e/ai/gate.ts),
      # keyless. The gate itself recreates the worker with `VISION_PROVIDER=fake
      # AI_BATCH_FLUSH_MINUTES=0` (compose interpolation on the worker's environment block,
      # decision D6) and recreates it without overrides in a finally, i.e. back to the stack
      # default, which is the CI project .env written above (fake, default flush interval). The
      # gate drops VISION_PROVIDER from its own environment for that restore, so it is not set
      # here either. No provider key exists in CI. Also shells out to `docker compose exec`/`run`
      # (db, worker, migrate `pnpm db:plan`). `--timeout-min 7` makes the gate's own wait expire
      # (writing e2e/ai-gate/results.json and restoring the worker) before the step timeout.
      - name: AI gate (PRD step-6 check, fake provider)
        timeout-minutes: 10
        env:
          AI_GATE_LOG: ${{ runner.temp }}/ai-gate/gate.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AI_GATE_LOG")"
          rc=0
          pnpm e2e:ai-gate --provider fake --timeout-min 7 2>&1 | tee "$AI_GATE_LOG" || rc=$?
          {
            echo '### AI gate (fake provider)'
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' "$AI_GATE_LOG" \
              | awk '/^AI GATE \(/{on=1; print; next} on && /^  /{print; next} {on=0}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      # The search gate signs demo-mom in (OTP via Mailpit); earlier steps spent sign-in codes.
      # (The gate also recreates api itself, which resets the counter too.)
      - name: Reset API rate limits before the search gate (restart api)
        run: bash .github/scripts/restart-api.sh

      # PRD step-7 check, "golden set of 50 queries on seed data finds the right photo in the top
      # 5 at least 85% of the time; answers cite photo IDs" (docs/plans/step-7.md 4.1,
      # e2e/search/gate.ts), keyless. The gate seeds the Golden baby with 2,000 photos
      # (`pnpm search:seed`, host-side, Postgres superuser on localhost), recreates api + worker
      # with VISION_PROVIDER=fake, runs the 50 golden queries through search and chat plus the
      # role/tier/log probes, writes e2e/search-gate/results.json and restores api + worker to
      # the stack default (the CI project .env above: fake). `--timeout-min 10` bounds the
      # gate's own embedding wait inside the 15-minute step timeout.
      - name: Search gate (PRD step-7 check, fake provider)
        timeout-minutes: 15
        env:
          SEARCH_GATE_LOG: ${{ runner.temp }}/search-gate/gate.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SEARCH_GATE_LOG")"
          rc=0
          pnpm e2e:search-gate --provider fake --count 2000 --timeout-min 10 2>&1 \
            | tee "$SEARCH_GATE_LOG" || rc=$?
          {
            echo '### Search gate (fake provider, 2,000 photos)'
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' "$SEARCH_GATE_LOG" \
              | awk '/^SEARCH GATE \(/{on=1; print; next} on && /^  /{print; next} {on=0}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      # The share gate signs two fresh parents in (OTP via Mailpit); the gates above spent
      # sign-in codes.
      - name: Reset API rate limits before the share gate (restart api)
        run: bash .github/scripts/restart-api.sh

      # PRD step-8 check, "expired or revoked link returns the expired page; sensitive photos never
      # auto-share" (docs/plans/step-8.md 4.1, e2e/sharing/gate.ts), keyless. Signs fresh parents
      # in (OTP via Mailpit), creates a Plus baby with three real uploads (analysed, analysed +
      # sensitive, unanalysed), then checks the viewer flow (hidden tile without URL, media
      # Cache-Control private), expired-by-SQL / revoked / regenerated links (API 410
      # share_link_expired and the /s/<token> expired page in Chromium, installed above), the
      # auto-share rule (no rule row for a sensitive or unanalysed photo anywhere) and the free
      # tier's 403 plan_required. Shells out to `docker compose exec`/`run` (db, worker, migrate
      # `pnpm db:plan`). Prints one PASS/FAIL line per check and exits 1 on any miss; any
      # e2e/share-gate/ output is uploaded on failure below.
      - name: Share gate (PRD step-8 check, fake provider)
        timeout-minutes: 15
        env:
          SHARE_GATE_LOG: ${{ runner.temp }}/share-gate/gate.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SHARE_GATE_LOG")"
          rc=0
          pnpm e2e:share-gate 2>&1 | tee "$SHARE_GATE_LOG" || rc=$?
          {
            echo '### Share gate (fake provider)'
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' "$SHARE_GATE_LOG" \
              | grep -E '^(PASS|FAIL)  |checks passed$|^FAILED:|^  - |^SHARE GATE|^gate crashed' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      # docs/plans/step-8.md 4.5: no share token (the seeded demo token is used by the smoke and
      # the e2e spec), passcode field, presign signature or latitude in the api/worker logs.
      # Captured to a file first (`logs | grep` can SIGPIPE under pipefail); grep exit 1 = clean.
      - name: No share tokens, passcodes, signatures or GPS in api/worker logs
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/share-logscan/api-worker.log"
          mkdir -p "$(dirname "$log")"
          docker compose -f docker-compose.dev.yml logs --no-color api worker > "$log" 2>&1 \
            || { echo "::error::docker compose logs failed"; exit 1; }
          grep -Ein 'demo-grandparents-share-token|"passcode"|X-Amz-Signature|latitude' "$log" \
            | cut -c1-200
          rc=${PIPESTATUS[0]}
          case "$rc" in
            1) echo "ok: no share token, passcode, signature or latitude in api/worker logs" ;;
            0) echo "::error::sensitive value in api/worker logs (lines above, truncated)"; exit 1 ;;
            *) echo "::error::grep failed (exit $rc)"; exit 1 ;;
          esac

      # The push gate recreates api and worker (no push debounce / gap, fake AI) and restores
      # them in its finally, so `docker compose logs` afterwards would only show the restored
      # containers. The tap follows every api/worker container while it runs (raw logs in
      # $RUNNER_TEMP, scanned below, never uploaded). No rate-limit restart is needed first: the
      # gate's own recreate of api resets the in-memory sign-in counter.
      - name: Start api/worker log tap (push gate)
        run: bash .github/scripts/log-tap.sh start "$RUNNER_TEMP/push-logs" api worker

      # Step-9 push gate (docs/plans/step-9.md 2.15 "Push gate", e2e/native/push-gate.ts), keyless,
      # no device: recreates api + worker with PUSH_PHOTOS_DEBOUNCE_SEC=0 PUSH_SHARE_DEBOUNCE_SEC=0
      # PUSH_MIN_GAP_MIN=0 VISION_PROVIDER=fake AI_BATCH_FLUSH_MINUTES=0 (compose interpolation;
      # PUSH_PROVIDER stays the dev default `fake`), signs a fresh admin in as the native client
      # (bearer tokens, no Set-Cookie), registers a fake APNs device, then: Plus baby + 3 photos
      # => one `fake` photos_analyzed delivery with item_count 3; Free baby => none; native viewer
      # exchange => one share_viewed, a reused session => none; unregister + sign-out => none;
      # api/worker logs hold none of its random tokens. Restores api + worker to the stack
      # default (the CI project .env: fake) in a finally and writes
      # e2e/native-results/push-gate.json. ~3-5 min (two recreates, 12 s quiet windows).
      - name: Push gate (step-9, fake push + AI providers)
        timeout-minutes: 15
        env:
          PUSH_GATE_LOG: ${{ runner.temp }}/push-gate/gate.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PUSH_GATE_LOG")"
          rc=0
          pnpm e2e:push-gate 2>&1 | tee "$PUSH_GATE_LOG" || rc=$?
          {
            echo '### Push gate (fake push provider)'
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' "$PUSH_GATE_LOG" \
              | grep -E '^(PASS|FAIL)  |^push gate: |^restore failed' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      - name: Stop api/worker log tap
        if: always()
        run: bash .github/scripts/log-tap.sh stop "$RUNNER_TEMP/push-logs"

      # docs/plans/step-9.md 9.16 / 2.15: nothing token-shaped in what api + worker printed during
      # the push gate (every container, incl. the recreated ones): no JWT (eyJ...), presign
      # part, Bearer value, 64-hex APNs-shaped or FCM-shaped device token, or a token field with
      # a real value (pino's "[redacted]" is fine). Prints file:line + pattern name only.
      # `--require push\.notify` fails the step if the tap captured no push job (vacuous scan).
      - name: No push device tokens, JWTs or signatures in api/worker logs
        run: >-
          node .github/scripts/scan-logs-for-secrets.mjs --require 'push\.notify'
          "$RUNNER_TEMP/push-logs"

      - name: Upload push gate output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: push-gate
          path: |
            e2e/native-results/
            ${{ runner.temp }}/push-gate
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload share gate output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: share-gate
          path: |
            e2e/share-gate/
            ${{ runner.temp }}/share-gate
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload search gate output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-gate
          path: |
            e2e/search-gate/
            ${{ runner.temp }}/search-gate
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload AI gate output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-gate
          path: |
            e2e/ai-gate/
            ${{ runner.temp }}/ai-gate
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload perf output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf
          path: |
            ${{ runner.temp }}/perf
            e2e/test-results-perf
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload gate output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upload-gate
          path: ${{ runner.temp }}/upload-gate
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Service status and logs
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml ps -a
          docker compose -f docker-compose.dev.yml logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans

  # docs/plans/step-9.md 2.14 "CI (9.16)": the Android debug build on every push/PR, the way
  # apps/mobile-web/NATIVE.md builds it locally. JDK 21 and the Android SDK come from the runner
  # image (JAVA_HOME_21_X64, ANDROID_HOME), so no extra action is needed. Debug key only: there is
  # no google-services.json (the Gradle file skips the google-services plugin without it, so FCM
  # stays off), no keystore.properties / signing secret, and no emulator (the Android gate,
  # `pnpm e2e:native-android`, needs HVF/KVM and runs locally).
  android-debug:
    name: Android debug build
    runs-on: ubuntu-24.04
    # Cold: pnpm install + web build (~2 min), SDK check, Gradle + dependency download and
    # assembleDebug (~5-8 min), lintDebug (~2-4 min). Warm Gradle cache roughly halves it.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The pre-installed Temurin 21 (Capacitor 8 / AGP 8 need 17+; the project is built and
      # tested with 21). Fails loudly if a runner image ever drops it.
      - name: Use JDK 21 from the runner image
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}" || { echo "::error::JAVA_HOME_21_X64 is not set on this runner"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version 2>&1 | tee /dev/stderr | grep -q 'version "21' \
            || { echo "::error::JAVA_HOME_21_X64 is not a JDK 21"; exit 1; }

      # compileSdk/targetSdk 36 (apps/mobile-web/android/variables.gradle). Installing an
      # already-present package is a no-op; the runner image has accepted the licences.
      - name: Android SDK platform 36 + build-tools 36.0.0
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "::error::ANDROID_HOME is not set on this runner"; exit 1; }
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "::error::$sdkmanager not found"; exit 1; }
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 \
            || { tail -n 50 "$RUNNER_TEMP/sdkmanager.log"; exit 1; }
          "$sdkmanager" --list_installed 2>/dev/null | grep -E 'platforms;android-36 |build-tools;36\.0\.0 '

      # The debug build must not depend on, or pick up, any credential. These files are
      # git-ignored (and the check job's native hygiene fails if one is ever tracked); this
      # proves the build below runs without them.
      - name: No Firebase config or signing material in the checkout
        run: |
          set -euo pipefail
          for f in apps/mobile-web/android/app/google-services.json \
                   apps/mobile-web/android/keystore.properties \
                   apps/mobile-web/ios/App/App/GoogleService-Info.plist; do
            test ! -e "$f" || { echo "::error::$f exists in the checkout"; exit 1; }
          done
          test -z "$(find apps/mobile-web -name '*.jks' -o -name '*.keystore' -o -name '*.p8' | head -n1)" \
            || { echo "::error::signing material in the checkout"; exit 1; }

      - name: Restore Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile-web/android/**/*.gradle', 'apps/mobile-web/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # `vite build` with the dev defaults (VITE_API_URL=http://localhost:8080, dev deep-link
      # scheme on), then `cap sync android`, which regenerates capacitor.settings.gradle, the
      # Cordova plugin project and the copied web assets (all git-ignored or generated).
      - name: Sync the web build into the Android project
        run: pnpm --filter @littlelight/mobile-web native:sync:android

      - name: Build debug APK (assembleDebug)
        run: pnpm --filter @littlelight/mobile-web android:build:debug

      - name: Android lint (lintDebug)
        working-directory: apps/mobile-web/android
        run: ./gradlew lintDebug

      # docs/plans/step-9.md 9.3: the merged manifest holds none of the media/storage/location/
      # audio permissions (nor anything the source manifest removes with tools:node="remove"),
      # and android:allowBackup="false".
      - name: Merged manifest (forbidden permissions, allowBackup)
        run: node .github/scripts/check-android-manifest.mjs debug

      - name: APK built
        run: |
          set -euo pipefail
          apk=apps/mobile-web/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk" || { echo "::error::$apk was not produced"; exit 1; }
          ls -l "$apk"
          echo "Android debug APK: $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint
          path: apps/mobile-web/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  # docs/plans/step-9.md 2.14 "CI (9.16)": the iOS Simulator build, manual only (Actions ->
  # CI -> Run workflow) because macOS minutes cost ~10x. `ios:build:sim` signs ad hoc
  # (CODE_SIGN_IDENTITY="-"): no Apple team, certificate or provisioning profile, and the
  # simulator app still carries its entitlements. Builds whatever Xcode/iOS SDK macos-latest
  # ships (printed first). The iOS gate (`pnpm e2e:native-ios`) needs a booted simulator and a
  # manual checklist, so it runs locally only (docs/plans/step-9.md 4.5).
  ios-sim-build:
    name: iOS Simulator build (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # pnpm install + web build (~3 min), SPM resolution + xcodebuild (~10-20 min cold).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator

      - name: No Firebase config or signing material in the checkout
        run: |
          set -euo pipefail
          test ! -e apps/mobile-web/ios/App/App/GoogleService-Info.plist
          test -z "$(find apps/mobile-web -name '*.p8' -o -name '*.p12' -o -name '*.mobileprovision' | head -n1)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync the web build into the iOS project
        run: pnpm --filter @littlelight/mobile-web native:sync:ios

      - name: Build for the iOS Simulator (ad-hoc signed)
        run: pnpm --filter @littlelight/mobile-web ios:build:sim

      # docs/plans/step-9.md 4.5: the built Info.plist, the privacy manifest and the
      # entitlements parse; the entitlements embedded in the app list the associated domains.
      - name: Plists and entitlements
        run: |
          set -euo pipefail
          app="$(find apps/mobile-web/ios/DerivedData -name 'App.app' -path '*iphonesimulator*' | head -n1)"
          test -n "$app" || { echo "::error::App.app not found under apps/mobile-web/ios/DerivedData"; exit 1; }
          plutil -lint "$app/Info.plist" \
            apps/mobile-web/ios/App/App/PrivacyInfo.xcprivacy \
            apps/mobile-web/ios/App/App/App.entitlements
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$app/Info.plist"
          codesign -d --entitlements - "$app" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.txt"
          grep -q 'applinks:littlelight.tesarsoft.com' "$RUNNER_TEMP/entitlements.txt" \
            || { echo "::error::associated domains entitlement missing from the built app"; exit 1; }
