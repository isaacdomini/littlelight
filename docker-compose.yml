# Littlelight production stack (on-prem server, reached only through Cloudflare Tunnel).
#
# cloudflared runs OUTSIDE this file (on the host, or on another machine on the LAN). Exactly two
# ports are published, bound to 127.0.0.1 by default so only the host-run cloudflared reaches them:
#   web     nginx :80        -> ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}
#   storage MinIO API :9000  -> ${STORAGE_BIND:-127.0.0.1}:${STORAGE_PORT:-9000}
# Tunnel public hostnames (ingress reference: docker/cloudflared/config.example.yml):
#   littlelight.tesarsoft.com        -> http://localhost:${WEB_PORT}
#   files.littlelight.tesarsoft.com  -> http://localhost:${STORAGE_PORT}, path ^/<S3_BUCKET>/. only,
#                                       NO "HTTP Host Header" override (presigned signatures are
#                                       validated against the original Host)
# Nothing else is published: not the MinIO console (9001), db, auth, api, mail or worker. If
# cloudflared runs on another machine, set WEB_BIND / STORAGE_BIND to this server's LAN address
# and firewall both ports to that machine only: whoever reaches them bypasses Cloudflare and can
# send their own CF-Connecting-IP (the client IP the api and GoTrue rate-limit on).
#
#   cp .env.example .env && $EDITOR .env      # fill every value; never commit .env
#   docker compose up -d --build --wait
#   docker compose ps
#   docker compose down                        # keeps db-data, STORAGE_PATH and BACKUP_PATH
#
# Host folders (create them first; Compose refuses to start if the variables are unset):
#   STORAGE_PATH  MinIO data (the photo library), bind-mounted at /data (storage) and read-only
#                 at /storage (worker, disk-usage alert only)
#   BACKUP_PATH   nightly pg_dump archives (docker/backup/pg-backup.sh)
# Off-site copies of both folders: docker/backup/offsite-backup.sh from host cron.
#
# Configuration: .env (from .env.example) is used ONLY for ${VAR} interpolation in this file. No
# service gets the whole file (no env_file): each one receives exactly the variables listed in
# its `environment:` block, so e.g. api/worker never see POSTGRES_PASSWORD, the other services'
# role passwords or tunnel credentials. SMTP goes to auth (sign-in codes), api (invites,
# new-device alerts) and worker (export ready/failed emails, docs/plans/review-fixes.md 2.4);
# auth gets no API secrets. Sentry (docs/plans/review-fixes.md 2.6): SENTRY_DSN and
# SENTRY_ENVIRONMENT reach api and worker only (x-app-env); the web DSN (SENTRY_WEB_DSN) is a
# build arg baked into the web bundle, never a runtime variable. AI provider keys:
# OPENAI_API_KEY goes to the worker (vision batches, document embeddings) and the api (chat,
# query embeddings, docs/plans/step-7.md 2.11); ANTHROPIC_API_KEY to the worker only; never
# to web, migrate, db-init or the backup job. Native apps (docs/plans/step-9.md 2.3, 2.5, 2.8):
# push credentials (PUSH_PROVIDER, APNS_*, FCM_*) go to the worker only; the store-review
# account (REVIEW_ACCOUNT_*) and the CORS allow-list (NATIVE_APP_ORIGINS) to the api only; the
# api additionally gets PUSH_SHARE_DEBOUNCE_SEC (a delay, not a secret). A new app
# variable must be added to .env.example AND to the x-app-env anchor (or the service's own
# block) below.
#
# Auth topology (docs/plans/step-3.md 2.1): browsers reach GoTrue only at /auth/health,
# /auth/authorize and /auth/callback (nginx 404s the rest); the api calls GoTrue at
# http://auth:9999 for codes, verify, refresh, sign-out and account deletion.
#
# Database roles (docs/plans/step-2.md 2.2) and start order:
#   db -> db-init   (superuser: creates/converges roles supabase_auth_admin, littlelight_api,
#                    littlelight_worker, viewer, pipeline, ... and the auth/pgboss schemas)
#      -> auth      (GoTrue as supabase_auth_admin; runs its own migrations, then /health)
#      -> migrate   (superuser: app migrations; they reference auth.users)
#      -> api       (littlelight_api, RLS enforced) / worker (littlelight_worker)
# MinIO (docs/plans/step-4.md 2.11): the root key (S3_ROOT_USER / S3_ROOT_PASSWORD) goes to
# storage and storage-init only. storage-init (docker/minio/init.sh) converges on every `up`:
# bucket + versioning, the 7-day noncurrent-version lifecycle rule, and two bucket-scoped users:
# api = S3_API_ACCESS_KEY (get/put/abort/list parts; no delete, no versions, no admin),
# worker = S3_WORKER_ACCESS_KEY (+ delete incl. object versions). Browser CORS on storage allows
# PUBLIC_URL and the two Capacitor WebView origins by default. The worker mounts STORAGE_PATH read-only at /storage for the 80 % disk alert.
# Never enable log_statement=all, log_parameter_max_length_on_error > 0 or pg_stat_statements
# parameter capture on `db`: request claims and encryption keys travel as bind parameters.
name: littlelight

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  restart: unless-stopped
  logging: *logging

# Superuser connection + role passwords: db-init and migrate only.
x-bootstrap-env: &bootstrap-env
  NODE_ENV: production
  TZ: ${TZ:-UTC}
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/littlelight
  AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
  API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
  WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}

# Shared by api and worker; each adds its own DATABASE_URL (app role) and service settings.
# Optional values default to "" (the apps treat empty as unset).
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: ${TZ:-UTC}
  PUBLIC_URL: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://files.littlelight.tesarsoft.com}
  # S3_ACCESS_KEY / S3_SECRET_KEY are per service (api and worker blocks), never the root key.
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  VISION_PROVIDER: ${VISION_PROVIDER:-openai}
  VISION_MODEL: ${VISION_MODEL:-gpt-6-luna}
  VISION_REASONING_EFFORT: ${VISION_REASONING_EFFORT:-none}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-6-luna}
  CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-low}
  EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
  EMBED_DIMS: ${EMBED_DIMS:-1024}
  # Search (docs/plans/step-7.md 2.4 searchEnvSchema): the api runs hybrid search, the worker
  # indexes (SEARCH_EMBED_BATCH, SEARCH_RECONCILE_CRON). Defaults = the code defaults.
  SEARCH_RERANK: ${SEARCH_RERANK:-off}
  SEARCH_EXACT_MAX: ${SEARCH_EXACT_MAX:-2000}
  SEARCH_HNSW_EF_SEARCH: ${SEARCH_HNSW_EF_SEARCH:-100}
  SEARCH_RECONCILE_CRON: ${SEARCH_RECONCILE_CRON:-17 * * * *}
  SEARCH_EMBED_BATCH: ${SEARCH_EMBED_BATCH:-100}
  # Chat (docs/plans/step-7.md 2.4 chatEnvSchema; read by the api).
  CHAT_TURNS_PER_DAY: ${CHAT_TURNS_PER_DAY:-100}
  CHAT_MAX_TOOL_ROUNDS: ${CHAT_MAX_TOOL_ROUNDS:-4}
  CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-800}
  CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-20}
  CHAT_MODEL_TIMEOUT_MS: ${CHAT_MODEL_TIMEOUT_MS:-30000}
  # Sharing (docs/plans/step-8.md 2.4 shareEnvSchema): viewer presigned-URL lifetime (api) and
  # the auto-share reconcile cron (worker). No secret: viewer/IP keys derive from JWT_SECRET.
  SHARE_MEDIA_URL_TTL_SEC: ${SHARE_MEDIA_URL_TTL_SEC:-300}
  SHARE_RECONCILE_CRON: ${SHARE_RECONCILE_CRON:-41 * * * *}
  # OpenAI key for api (chat + query embeddings) and worker (batches + document embeddings).
  # Empty => AI disabled with one log line in each. Only api and worker merge this anchor, so
  # web, migrate, db-init and backup never get it. AI_ALLOW_FAKE_IN_PRODUCTION and FAKE_* are
  # deliberately not passed anywhere, so VISION_PROVIDER=fake can never run in production.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Empty = the real provider API (mock servers in testing only).
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  # AI batch pipeline (docs/plans/step-6.md 2.10): the worker runs it, the api reports usage
  # against the same budget/attempt limits. ANTHROPIC_API_KEY is NOT here: worker only.
  AI_BATCH_FLUSH_MINUTES: ${AI_BATCH_FLUSH_MINUTES:-30}
  AI_BATCH_MAX_PHOTOS: ${AI_BATCH_MAX_PHOTOS:-1000}
  AI_BABY_MONTHLY_BUDGET_USD: ${AI_BABY_MONTHLY_BUDGET_USD:-3}
  AI_BUDGET_ALERT_PCT: ${AI_BUDGET_ALERT_PCT:-80}
  AI_QUEUE_AGE_ALERT_MINUTES: ${AI_QUEUE_AGE_ALERT_MINUTES:-120}
  AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
  # Error reporting (docs/plans/review-fixes.md 2.6, D8), api + worker only: errors, scrubbed,
  # no traces. Empty DSN => Sentry is never initialised (no network). SENTRY_ENVIRONMENT empty
  # => NODE_ENV (production).
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}

# Node services: non-root image user, no capabilities, read-only root filesystem.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: littlelight
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d littlelight"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # One-shot: Postgres roles (supabase_auth_admin for GoTrue, littlelight_api, littlelight_worker,
  # viewer, pipeline, ...), the auth schema GoTrue needs and the pgboss schema. Idempotent; it
  # re-applies passwords/attributes from .env on every start (also the step after a restore).
  db-init:
    <<: *hardened
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    image: littlelight-db-tools
    command: ["pnpm", "db:bootstrap"]
    restart: "no"
    logging: *logging
    environment: *bootstrap-env
    depends_on:
      db:
        condition: service_healthy

  # One-shot: app migrations (no seed in production). Runs after GoTrue is healthy, i.e. after
  # GoTrue's own migrations created auth.users, which the app tables reference.
  # Operator paid-tier switch until billing webhooks exist (docs/plans/step-6.md D7; audited):
  #   docker compose run --rm migrate pnpm db:plan <babyId> plus|free --i-know-this-is-production
  migrate:
    <<: *hardened
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    image: littlelight-db-tools
    command: ["pnpm", "db:migrate"]
    restart: "no"
    logging: *logging
    environment: *bootstrap-env
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy

  auth:
    image: supabase/auth:v2.197.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Explicit environment only: GoTrue never sees the superuser or app-role credentials.
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}@db:5432/littlelight
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth
      GOTRUE_SITE_URL: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}
      API_EXTERNAL_URL: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-https://littlelight.tesarsoft.com/**}
      # Rate-limit on the client IP Cloudflare sets (clients cannot bypass Cloudflare: the only
      # published ports are bound to 127.0.0.1 for the host-run cloudflared, see the header).
      # OAuth redirects arrive via cloudflared -> nginx, which passes the header through; the
      # api, which calls GoTrue directly for everything else, forwards the client's
      # CF-Connecting-IP, so GoTrue's own per-IP limits (defaults: 30 codes / 30 verifies per
      # 5 min) see the real client. The PRD's stricter per-email/per-IP limits and Turnstile are
      # enforced by the api.
      GOTRUE_RATE_LIMIT_HEADER: CF-Connecting-IP
      # Passwordless only: email codes (+ Apple/Google when enabled). No phone, no anonymous users.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # Email OTP: 6 digits, valid 10 minutes; the magic-link token_hash shares this expiry.
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      # Sessions (PRD "Sessions and tokens", docs/plans/step-3.md 2.2): access JWT 1 h (above);
      # refresh tokens rotate on every use and reusing an old one (outside a 10 s grace window for
      # concurrent tabs) revokes the session family; sessions end after 90 days without a refresh
      # (native bound; the web cookie's 30-day Max-Age is the shorter web bound); many devices.
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      # Refresh algorithm v2 (supabase/auth v2.197.0 internal/tokens/service.go): new sessions get
      # HMAC-signed counter tokens, and reusing one more than one step behind the current counter
      # outside the reuse interval DELETEs the auth.sessions row (so the API's liveness check 401s
      # the session's access tokens at once). v1 only marked refresh_tokens revoked and left the
      # session alive. The immediately previous token stays redeemable (GoTrue's "fail-to-save"
      # tolerance; it re-issues the current token without advancing the counter). Upgrade 100 %
      # moves any v1 session to v2 on its next refresh.
      GOTRUE_SECURITY_REFRESH_TOKEN_ALGORITHM_VERSION: "2"
      GOTRUE_SECURITY_REFRESH_TOKEN_UPGRADE_PERCENTAGE: "100"
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: 2160h
      GOTRUE_SESSIONS_SINGLE_PER_USER: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      # Same From address as the api's mail (MAIL_FROM, defaulting to SMTP_ADMIN_EMAIL).
      GOTRUE_SMTP_ADMIN_EMAIL: ${MAIL_FROM:-${SMTP_ADMIN_EMAIL:?Set SMTP_ADMIN_EMAIL in .env}}
      GOTRUE_SMTP_SENDER_NAME: Littlelight
      # At most one sign-in email per address per 60 s (matches the app's resend cooldown) and a
      # global backstop of 200 emails per hour; per-email/per-IP limits live in the api.
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "200"
      # Served by the web (nginx) container from docker/gotrue/templates: the 6-digit code plus a
      # web-only fallback link to /signin/callback#token_hash=... No URLPATHS settings: the
      # templates don't use {{ .ConfirmationURL }} (GoTrue's /verify is not browser-facing).
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://web/email-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://web/email-templates/magic-link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your Littlelight sign-in code
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your Littlelight sign-in code
      # Social sign-in: off until the credentials in .env.example exist; then set the *_ENABLED
      # flag to "true" in .env (the same flag turns the button on in the api, see below).
      # Verified-email auto-linking is GoTrue's default; unverified provider emails never link.
      # Register ${PUBLIC_URL}/auth/callback as the redirect / return URL at both providers.
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${GOTRUE_EXTERNAL_APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth/callback
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  storage:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:?Set S3_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD in .env}
      MINIO_SERVER_URL: ${S3_PUBLIC_ENDPOINT:-https://files.littlelight.tesarsoft.com}
      # Browser part PUTs and signed GETs come from the web app origin and the native apps'
      # WebView origins (iOS capacitor://localhost, Android https://localhost; docs/plans/
      # step-9.md 2.3). Override the whole comma list with S3_CORS_ALLOW_ORIGIN.
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOW_ORIGIN:-${PUBLIC_URL:-https://littlelight.tesarsoft.com},capacitor://localhost,https://localhost}
    volumes:
      - ${STORAGE_PATH:?Set STORAGE_PATH to the mounted photo folder}:/data
    # S3 API only, for the host-run cloudflared (files. hostname). The console (:9001) is never
    # published.
    ports:
      - "${STORAGE_BIND:-127.0.0.1}:${STORAGE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  # One-shot, idempotent (docker/minio/init.sh): bucket + versioning, lifecycle
  # (docker/minio/lifecycle.json), users for api and worker with exactly one bucket-scoped
  # policy each (docker/minio/policy-*.json). Re-applies the service-account secrets from .env
  # on every run (rotation: edit .env, `docker compose up -d --force-recreate storage-init api worker`).
  storage-init:
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    restart: "no"
    logging: *logging
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_ROOT_USER: ${S3_ROOT_USER:?Set S3_ROOT_USER in .env}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY:?Set S3_API_ACCESS_KEY in .env}
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?Set S3_API_SECRET_KEY in .env}
      S3_WORKER_ACCESS_KEY: ${S3_WORKER_ACCESS_KEY:?Set S3_WORKER_ACCESS_KEY in .env}
      S3_WORKER_SECRET_KEY: ${S3_WORKER_SECRET_KEY:?Set S3_WORKER_SECRET_KEY in .env}
    volumes:
      - ./docker/minio:/minio:ro
    entrypoint: ["/bin/bash", "/minio/init.sh"]
    depends_on:
      storage:
        condition: service_healthy

  api:
    <<: [*app, *hardened]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    environment:
      <<: *app-env
      DATABASE_URL: postgres://littlelight_api:${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}@db:5432/littlelight
      # Bucket-scoped MinIO user (created by storage-init; no delete, no versions, no admin).
      S3_ACCESS_KEY: ${S3_API_ACCESS_KEY:?Set S3_API_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_API_SECRET_KEY:?Set S3_API_SECRET_KEY in .env}
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      # Auth (docs/plans/step-3.md 2.8). One .env flag per provider feeds GoTrue and the api.
      AUTH_INTERNAL_URL: http://auth:9999
      AUTH_APPLE_ENABLED: ${GOTRUE_EXTERNAL_APPLE_ENABLED:-false}
      AUTH_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      # Cloudflare Turnstile on the sign-in form after 3 code requests per IP per hour; inert
      # while the secret is empty.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # App emails (invites, new-device alerts) over the same SMTP account as GoTrue. The worker
      # gets the same block (export emails).
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-${SMTP_ADMIN_EMAIL:?Set SMTP_ADMIN_EMAIL in .env}}
      # Entitlement webhooks, later steps.
      REVENUECAT_API_KEY: ${REVENUECAT_API_KEY:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Native apps (docs/plans/step-9.md 2.3): Origins allowed to call /api cross-origin (CORS
      # without credentials; the apps use bearer tokens). iOS WebView = capacitor://localhost,
      # Android WebView = https://localhost.
      NATIVE_APP_ORIGINS: ${NATIVE_APP_ORIGINS:-capacitor://localhost,https://localhost}
      # The api enqueues share_viewed pushes with this delay (s). No push credential or other
      # push setting reaches the api: those are worker-only (below).
      PUSH_SHARE_DEBOUNCE_SEC: ${PUSH_SHARE_DEBOUNCE_SEC:-60}
      # Store-review sign-in (docs/plans/step-9.md 2.5, D4), api only. Off unless BOTH are set:
      # then that one email signs in with the static code whose scrypt hash is given (no email
      # is sent). See .env.example for how to generate the hash; quote it there with '...'.
      REVIEW_ACCOUNT_EMAIL: ${REVIEW_ACCOUNT_EMAIL:-}
      REVIEW_ACCOUNT_CODE_HASH: ${REVIEW_ACCOUNT_CODE_HASH:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  worker:
    <<: [*app, *hardened]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: prod
    environment:
      <<: *app-env
      DATABASE_URL: postgres://littlelight_worker:${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}@db:5432/littlelight
      # Bucket-scoped MinIO user (api's rights + delete incl. object versions; no admin).
      S3_ACCESS_KEY: ${S3_WORKER_ACCESS_KEY:?Set S3_WORKER_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_WORKER_SECRET_KEY:?Set S3_WORKER_SECRET_KEY in .env}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
      HEARTBEAT_STALE_MS: ${HEARTBEAT_STALE_MS:-30000}
      # photo.ingest jobs per worker process (1-8); memory is bounded by mem_limit below.
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
      # Disk alert: heartbeat statfs of the read-only STORAGE_PATH mount; warns once above this %.
      STORAGE_DISK_PATH: /storage
      STORAGE_DISK_ALERT_PCT: ${STORAGE_DISK_ALERT_PCT:-80}
      # CSAM hash matching (docs/plans/step-4.md 2.9): `none` until a provider is enrolled.
      CSAM_MATCHER: ${CSAM_MATCHER:-none}
      PHOTODNA_API_KEY: ${PHOTODNA_API_KEY:-}
      PHOTODNA_ENDPOINT: ${PHOTODNA_ENDPOINT:-}
      # OPENAI_API_KEY / OPENAI_BASE_URL come from x-app-env (api + worker). The Anthropic
      # fallback adapter (VISION_PROVIDER=anthropic, vision batches only) is worker-only. Empty
      # => skipped with one log line. AI_ALLOW_FAKE_IN_PRODUCTION and FAKE_VISION_* are
      # deliberately not passed, so VISION_PROVIDER=fake can never run here.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Empty = the real provider API (mock servers in testing only).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Worker-only pipeline tuning; empty => code defaults (packages/shared aiPipelineEnvSchema).
      AI_BATCH_MAX_BYTES: ${AI_BATCH_MAX_BYTES:-}
      AI_FLUSH_INTERVAL_CRON: ${AI_FLUSH_INTERVAL_CRON:-}
      AI_POLL_INTERVAL_CRON: ${AI_POLL_INTERVAL_CRON:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
      AI_IMAGE_DETAIL: ${AI_IMAGE_DETAIL:-}
      # Push notifications (docs/plans/step-9.md 2.8), worker only: none (default; nothing is
      # sent until the keys exist) | live (APNs for iOS devices if APNS_* are set, FCM for
      # Android if FCM_* are set). `fake` is refused when NODE_ENV=production. Empty values =
      # unset / code defaults (APNS_BUNDLE_ID = com.tesarsoft.littlelight; *_BASE_URL = the
      # real Apple/Google endpoints, mock servers in testing only).
      PUSH_PROVIDER: ${PUSH_PROVIDER:-none}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY_BASE64: ${APNS_PRIVATE_KEY_BASE64:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_BASE64: ${FCM_SERVICE_ACCOUNT_BASE64:-}
      PUSH_APNS_BASE_URL: ${PUSH_APNS_BASE_URL:-}
      PUSH_FCM_BASE_URL: ${PUSH_FCM_BASE_URL:-}
      PUSH_OAUTH_TOKEN_URL: ${PUSH_OAUTH_TOKEN_URL:-}
      PUSH_PHOTOS_DEBOUNCE_SEC: ${PUSH_PHOTOS_DEBOUNCE_SEC:-600}
      PUSH_SHARE_DEBOUNCE_SEC: ${PUSH_SHARE_DEBOUNCE_SEC:-60}
      PUSH_MIN_GAP_MIN: ${PUSH_MIN_GAP_MIN:-60}
      # Data export (docs/plans/review-fixes.md 2.3, 2.4, D5), worker only. EXPORT_MAX_BYTES caps
      # the summed size of one export's originals (empty => 100 GiB; at least 1 GiB); an export
      # temporarily doubles the album's footprint on STORAGE_PATH until it expires (7 days).
      EXPORT_MAX_BYTES: ${EXPORT_MAX_BYTES:-}
      # "Your export is ready/failed" emails (no link in them) over the api's SMTP account.
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-${SMTP_ADMIN_EMAIL:?Set SMTP_ADMIN_EMAIL in .env}}
    volumes:
      # MinIO's data folder, read-only, only for statfs (objects are read through S3).
      - type: bind
        source: ${STORAGE_PATH:?Set STORAGE_PATH to the mounted photo folder}
        target: /storage
        read_only: true
    # Two concurrent 48 MP HEIC decodes are ~800 MB RSS (INGEST_CONCURRENCY=2).
    mem_limit: 2g
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 10s
      timeout: 10s
      retries: 2
      start_period: 60s
      start_interval: 3s

  # nginx: SPA + /api/ and /auth/ proxies (docker/nginx/default.conf). Needs no app secrets;
  # its environment only fills the Content-Security-Policy snippet
  # (docker/nginx/templates/csp.conf.template, rendered at start; docs/plans/review-fixes.md
  # 2.11, D9). Published for the host-run cloudflared only (see the header).
  web:
    build:
      context: .
      dockerfile: apps/mobile-web/Dockerfile
      target: prod
      args:
        # Browser error reporting on the web origin only (empty => no Sentry code is loaded).
        # Baked in at build time: rebuild the image after changing it, and put the DSN's ingest
        # origin in WEB_CSP_CONNECT_EXTRA. Native builds never get it.
        VITE_SENTRY_DSN: ${SENTRY_WEB_DSN:-}
    restart: unless-stopped
    logging: *logging
    environment:
      # Content-Security-Policy-Report-Only (default) | Content-Security-Policy (enforce).
      WEB_CSP_HEADER: ${WEB_CSP_HEADER:-Content-Security-Policy-Report-Only}
      # Presigned photo GETs and upload part PUTs go to this origin (img-src, connect-src).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://files.littlelight.tesarsoft.com}
      # Extra connect-src origins (space-separated), e.g. the Sentry ingest origin.
      WEB_CSP_CONNECT_EXTRA: ${WEB_CSP_CONNECT_EXTRA:-}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # Nightly pg_dump (custom format) + roles to BACKUP_PATH, kept BACKUP_RETENTION_DAYS (35).
  # Restore test: docker compose run --rm --no-deps --entrypoint bash backup /scripts/restore-test.sh
  backup:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: littlelight
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_PATH:?Set BACKUP_PATH to a backup folder}:/backups
      - ./docker/backup:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/pg-backup.sh"]
    healthcheck:
      # Unhealthy if the newest verified dump is older than 26 hours.
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'littlelight-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 30m
      start_interval: 10s

volumes:
  db-data:
