# Littlelight production stack (on-prem server, reached only through Cloudflare Tunnel; no
# inbound ports are published).
#
#   cp .env.example .env && $EDITOR .env      # fill every value; never commit .env
#   docker compose up -d --build --wait
#   docker compose ps
#   docker compose down                        # keeps db-data, STORAGE_PATH and BACKUP_PATH
#
# Host folders (create them first; Compose refuses to start if the variables are unset):
#   STORAGE_PATH  MinIO data (the photo library), bind-mounted at /data
#   BACKUP_PATH   nightly pg_dump archives (docker/backup/pg-backup.sh)
# Off-site copies of both folders: docker/backup/offsite-backup.sh from host cron.
#
# Configuration: .env (from .env.example) is used ONLY for ${VAR} interpolation in this file. No
# service gets the whole file (no env_file): each one receives exactly the variables listed in
# its `environment:` block, so e.g. api/worker never see POSTGRES_PASSWORD, the other services'
# role passwords, SMTP or tunnel credentials. A new app variable must be added to .env.example
# AND to the x-app-env anchor (or the service's own block) below.
#
# Database roles (docs/plans/step-2.md 2.2) and start order:
#   db -> db-init   (superuser: creates/converges roles supabase_auth_admin, littlelight_api,
#                    littlelight_worker, viewer, pipeline, ... and the auth/pgboss schemas)
#      -> auth      (GoTrue as supabase_auth_admin; runs its own migrations, then /health)
#      -> migrate   (superuser: app migrations; they reference auth.users)
#      -> api       (littlelight_api, RLS enforced) / worker (littlelight_worker)
# Never enable log_statement=all, log_parameter_max_length_on_error > 0 or pg_stat_statements
# parameter capture on `db`: request claims and encryption keys travel as bind parameters.
name: littlelight

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  restart: unless-stopped
  logging: *logging

# Superuser connection + role passwords: db-init and migrate only.
x-bootstrap-env: &bootstrap-env
  NODE_ENV: production
  TZ: ${TZ:-UTC}
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/littlelight
  AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
  API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
  WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}

# Shared by api and worker; each adds its own DATABASE_URL (app role) and service settings.
# Optional values default to "" (the apps treat empty as unset).
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: ${TZ:-UTC}
  PUBLIC_URL: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://files.littlelight.tesarsoft.com}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  VISION_PROVIDER: ${VISION_PROVIDER:-openai}
  VISION_MODEL: ${VISION_MODEL:-gpt-6-luna}
  VISION_REASONING_EFFORT: ${VISION_REASONING_EFFORT:-none}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-6-luna}
  CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-low}
  EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
  EMBED_DIMS: ${EMBED_DIMS:-1024}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

# Node services: non-root image user, no capabilities, read-only root filesystem.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: littlelight
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d littlelight"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # One-shot: Postgres roles (supabase_auth_admin for GoTrue, littlelight_api, littlelight_worker,
  # viewer, pipeline, ...), the auth schema GoTrue needs and the pgboss schema. Idempotent; it
  # re-applies passwords/attributes from .env on every start (also the step after a restore).
  db-init:
    <<: *hardened
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    image: littlelight-db-tools
    command: ["pnpm", "db:bootstrap"]
    restart: "no"
    logging: *logging
    environment: *bootstrap-env
    depends_on:
      db:
        condition: service_healthy

  # One-shot: app migrations (no seed in production). Runs after GoTrue is healthy, i.e. after
  # GoTrue's own migrations created auth.users, which the app tables reference.
  migrate:
    <<: *hardened
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    image: littlelight-db-tools
    command: ["pnpm", "db:migrate"]
    restart: "no"
    logging: *logging
    environment: *bootstrap-env
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy

  auth:
    image: supabase/auth:v2.197.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Explicit environment only: GoTrue never sees the superuser or app-role credentials.
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}@db:5432/littlelight
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth
      GOTRUE_SITE_URL: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}
      API_EXTERNAL_URL: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-https://littlelight.tesarsoft.com/**}
      # Everything reaches GoTrue through cloudflared -> nginx, so rate-limit on the client IP
      # Cloudflare sets (clients cannot bypass Cloudflare: the server has no open ports).
      GOTRUE_RATE_LIMIT_HEADER: CF-Connecting-IP
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:?Set SMTP_ADMIN_EMAIL in .env}
      GOTRUE_SMTP_SENDER_NAME: Littlelight
      # Served by the web (nginx) container from docker/gotrue/templates; show the 6-digit code.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://web/email-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://web/email-templates/magic-link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your Littlelight sign-in code
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your Littlelight sign-in code
      # GoTrue resolves these against API_EXTERNAL_URL's origin, dropping /auth; repeat it.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/verify
      GOTRUE_MAILER_URLPATHS_MAGIC_LINK: /auth/verify
      # Off until step 3 supplies real client IDs (set the *_ENABLED flags to "true" in .env then).
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${GOTRUE_EXTERNAL_APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth/callback
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL:-https://littlelight.tesarsoft.com}/auth/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  storage:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      MINIO_SERVER_URL: ${S3_PUBLIC_ENDPOINT:-https://files.littlelight.tesarsoft.com}
    volumes:
      - ${STORAGE_PATH:?Set STORAGE_PATH to the mounted photo folder}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  # One-shot: create the bucket and turn versioning on (idempotent).
  storage-init:
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    restart: "no"
    logging: *logging
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://storage:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null &&
        mc mb -p "local/$$S3_BUCKET" &&
        mc version enable "local/$$S3_BUCKET"
    depends_on:
      storage:
        condition: service_healthy

  api:
    <<: [*app, *hardened]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    environment:
      <<: *app-env
      DATABASE_URL: postgres://littlelight_api:${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}@db:5432/littlelight
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      # App emails (invites); one of the two, later steps.
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Entitlement webhooks, later steps.
      REVENUECAT_API_KEY: ${REVENUECAT_API_KEY:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  worker:
    <<: [*app, *hardened]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: prod
    environment:
      <<: *app-env
      DATABASE_URL: postgres://littlelight_worker:${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}@db:5432/littlelight
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
      HEARTBEAT_STALE_MS: ${HEARTBEAT_STALE_MS:-30000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 10s
      timeout: 10s
      retries: 2
      start_period: 60s
      start_interval: 3s

  # nginx: SPA + /api/ and /auth/ proxies (docker/nginx/default.conf). Needs no app secrets,
  # so it gets no environment.
  web:
    build:
      context: .
      dockerfile: apps/mobile-web/Dockerfile
      target: prod
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # Public hostnames are configured on the tunnel in the Cloudflare dashboard (token-managed
  # tunnel); see docker/cloudflared/config.example.yml for the exact ingress they must match.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    logging: *logging
    command: tunnel --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      web:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nightly pg_dump (custom format) + roles to BACKUP_PATH, kept BACKUP_RETENTION_DAYS (35).
  # Restore test: docker compose run --rm --no-deps --entrypoint bash backup /scripts/restore-test.sh
  backup:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: littlelight
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_PATH:?Set BACKUP_PATH to a backup folder}:/backups
      - ./docker/backup:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/pg-backup.sh"]
    healthcheck:
      # Unhealthy if the newest verified dump is older than 26 hours.
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'littlelight-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 30m
      start_interval: 10s

volumes:
  db-data:
