<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinyglow logo (approved concept)</title>
<style>
  body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  section { padding: 24px 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; }
  .light { background: #fff; color: #1c1c1e; }
  .dark { background: #0e0f11; color: #eee; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 8px; font-size: 13px; opacity: .7; }
  h2 { width: 100%; margin: 0; font-size: 16px; font-weight: 600; }
  .home { width: 252px; height: 300px; border-radius: 18px; padding: 40px 18px; box-sizing: border-box;
          background: linear-gradient(135deg, #5b7fa8, #c98c8c); display: grid;
          grid-template-columns: repeat(3, 60px); gap: 30px 18px; }
  .home span { width: 60px; height: 60px; border-radius: 13px; background: rgba(255,255,255,.55); }
  .home img { width: 60px; height: 60px; }
</style>
</head>
<body>
<section class="light">
  <h2>Concept vs vector (512 px)</h2>
  <figure><img src="../../icon.jpeg" width="512" height="512" alt="concept"><figcaption>icon.jpeg</figcaption></figure>
  <figure><img src="tinyglow-icon.svg" width="512" height="512" alt="vector"><figcaption>tinyglow-icon.svg</figcaption></figure>
</section>
<section class="dark">
  <h2>Concept vs vector on dark</h2>
  <figure><img src="../../icon.jpeg" width="256" height="256" alt="concept"></figure>
  <figure><img src="tinyglow-icon.svg" width="256" height="256" alt="vector"></figure>
  <figure><img src="tinyglow-icon.svg" width="60" height="60" alt=""><figcaption>60 px</figcaption></figure>
</section>
<section class="light">
  <h2>tinyglow-mark.svg and small sizes on light (small sizes use the full icon, ../logo/app-icon-small.svg)</h2>
  <figure><img src="tinyglow-mark.svg" width="320" height="320" alt=""><figcaption>mark</figcaption></figure>
  <figure><img src="tinyglow-mark.svg" width="48" height="48" alt=""><figcaption>mark 48</figcaption></figure>
  <figure><img src="tinyglow-mark.svg" width="28" height="28" alt=""><figcaption>mark 28 (app header)</figcaption></figure>
  <figure><img src="../logo/app-icon-small.svg" width="48" height="48" alt=""><figcaption>icon 48</figcaption></figure>
  <figure><img src="../logo/app-icon-small.svg" width="32" height="32" alt=""><figcaption>icon 32</figcaption></figure>
  <figure><img src="../logo/app-icon-small.svg" width="16" height="16" alt=""><figcaption>icon 16 (favicon)</figcaption></figure>
</section>
<section class="dark">
  <h2>tinyglow-mark.svg and small sizes on dark (small sizes use the full icon, ../logo/app-icon-small.svg)</h2>
  <figure><img src="tinyglow-mark.svg" width="320" height="320" alt=""><figcaption>mark</figcaption></figure>
  <figure><img src="tinyglow-mark.svg" width="48" height="48" alt=""><figcaption>mark 48</figcaption></figure>
  <figure><img src="tinyglow-mark.svg" width="28" height="28" alt=""><figcaption>mark 28 (app header)</figcaption></figure>
  <figure><img src="../logo/app-icon-small.svg" width="48" height="48" alt=""><figcaption>icon 48</figcaption></figure>
  <figure><img src="../logo/app-icon-small.svg" width="32" height="32" alt=""><figcaption>icon 32</figcaption></figure>
  <figure><img src="../logo/app-icon-small.svg" width="16" height="16" alt=""><figcaption>icon 16 (favicon)</figcaption></figure>
</section>
<section class="light">
  <h2>Home screen (60 px)</h2>
  <div class="home"><span></span><span></span><span></span><span></span><img src="tinyglow-icon.svg" alt="Tinyglow"><span></span><span></span><span></span><span></span></div>
</section>
</body>
</html>
