# Littlelight local development stack. Zero setup: a fresh clone + Docker is enough.
#
#   docker compose -f docker-compose.dev.yml up            (or: pnpm dev)
#   docker compose -f docker-compose.dev.yml down          (or: pnpm dev:down)
#   docker compose -f docker-compose.dev.yml down -v       wipe dev-db / dev-s3 (pnpm dev:reset)
#
# Config: .env.dev (committed, dev-only defaults) + optional git-ignored .env.local overrides,
# loaded by the Node services (migrate, api, worker, web). db-init, auth, storage and
# storage-init get explicit environment blocks only (least privilege: GoTrue never sees the
# superuser DATABASE_URL, MinIO never sees the JWT secret). Values that two sides must agree on
# live once, in x-dev-shared below, and are injected into both sides, so they can't drift.
# Database roles (docs/plans/step-2.md 2.2): db-init/migrate connect as the `postgres` superuser;
# api connects as `littlelight_api`, worker as `littlelight_worker` (each gets its own
# DATABASE_URL below); GoTrue as `supabase_auth_admin`.
# Start order: db -> db-init (roles + auth schema) -> auth (GoTrue runs its own migrations, so
# auth.users exists once it is healthy) -> migrate (app migrations + demo seed) -> api, worker.
# Data: named volumes only (dev-db, dev-s3); no host folders to create.
# MinIO (docs/plans/step-4.md 2.11): the root key (dev / devdevdev) goes to storage and
# storage-init only. storage-init (docker/minio/init.sh) creates the bucket, the 7-day
# noncurrent-version lifecycle rule and two bucket-scoped users: api signs and calls S3 as
# littlelight-api (get/put/abort/list parts, no delete), worker as littlelight-worker (+ delete,
# incl. object versions). The worker also mounts dev-s3 read-only at /storage for the disk alert.
# Host-side tests may still use the root key against localhost:9000.
# Ports: the app (8080) and MinIO S3 (9000) listen on all interfaces so a phone on the LAN can
# reach them; everything else (db, api, auth, MinIO console, Mailpit) is bound to 127.0.0.1.
# Every published HOST port comes from a variable whose default is the port above, so nothing
# needs setting when they are free:
#   WEB_PORT 8080, STORAGE_PORT 9000, STORAGE_CONSOLE_PORT 9001, DB_PORT 5432, AUTH_PORT 9999,
#   API_PORT 3000, MAILPIT_PORT 8025
# Container-internal ports never change. Values that embed a public port follow the same
# variables: PUBLIC_URL / GoTrue site URL, issuer and redirect URIs (http://localhost:$WEB_PORT)
# and S3_PUBLIC_ENDPOINT (http://localhost:$STORAGE_PORT, the host in presigned URLs).
# These are Compose INTERPOLATION variables: set them in the shell or in a git-ignored `.env`
# next to this file (Compose reads it automatically), e.g. `WEB_PORT=18080 STORAGE_PORT=19000
# docker compose -f docker-compose.dev.yml up`. `.env.local` (an env_file) cannot change them.
# On a dev machine `.env` holds only such dev overrides; never copy .env.example (production)
# there: its S3_PUBLIC_ENDPOINT etc. would be picked up by this file.
# Auth (docs/plans/step-3.md 2.1, 2.8): the browser reaches GoTrue only at /auth/health,
# /auth/authorize and /auth/callback (the Vite proxy 404s every other /auth/* path); sign-in
# codes, verify, refresh and sign-out go through the API at /api/auth/*, which calls GoTrue at
# http://auth:9999 and sends invite / new-device mail to Mailpit itself.
# Apple / Google sign-in are off. To try Google OAuth locally (Apple web OAuth does not work on
# localhost), export the flag and credentials in your shell before `up`; both GoTrue and the API
# follow the same flag:
#   GOTRUE_EXTERNAL_GOOGLE_ENABLED=true GOOGLE_CLIENT_ID=<web client id> \
#   GOOGLE_CLIENT_SECRET=<secret> docker compose -f docker-compose.dev.yml up
# (register http://localhost:${WEB_PORT:-8080}/auth/callback as the client's redirect URI).
# AI (docs/plans/step-6.md 2.10, docs/plans/step-7.md 2.11): paid tier only. Put OPENAI_API_KEY
# (and optionally ANTHROPIC_API_KEY) in the git-ignored .env.local. The worker (vision batches,
# document embeddings) and the api (chat, query embeddings) hold OPENAI_API_KEY;
# ANTHROPIC_API_KEY reaches the worker only; migrate and web get neither (blanked). No key =>
# both log "AI disabled: ..." and stay healthy; search falls back to keyword + filters and chat
# answers "not configured". Keyless full stack (fake vision, fake chat model, fake embedder):
#   VISION_PROVIDER=fake AI_BATCH_FLUSH_MINUTES=0 \
#     docker compose -f docker-compose.dev.yml up -d --no-deps api worker
# VISION_PROVIDER is the single provider switch for both services (step-7 D12); a plain `up`
# afterwards puts both back on openai.
# Chat streams over SSE (POST /api/babies/<id>/chat/messages, text/event-stream). The Vite dev
# proxy (apps/mobile-web/vite.config.ts, frontend-owned) streams proxied responses unbuffered by
# default, so dev needs no proxy setting; production nginx disables buffering on that path only
# (docker/nginx/default.conf).
# Native apps (docs/plans/step-9.md 2.3, 2.8, 2.14): the api allows CORS (no credentials) from
# NATIVE_APP_ORIGINS (.env.dev: capacitor://localhost,https://localhost). Push is FAKE in dev:
# the worker alone gets PUSH_PROVIDER (default fake: one log line per delivery, nothing leaves
# the machine) and the push timing knobs, all Compose INTERPOLATION variables; the api gets
# PUSH_SHARE_DEBOUNCE_SEC only (it enqueues share_viewed). Push gate (no wait, no gap):
#   PUSH_PHOTOS_DEBOUNCE_SEC=0 PUSH_SHARE_DEBOUNCE_SEC=0 PUSH_MIN_GAP_MIN=0 VISION_PROVIDER=fake \
#     AI_BATCH_FLUSH_MINUTES=0 docker compose -f docker-compose.dev.yml up -d --no-deps api worker
# APNs/FCM credentials (APNS_*, FCM_*) are worker-only and the store-review account
# (REVIEW_ACCOUNT_*) is api-only: put either in .env.local and the blanks below strip them from
# every other service that loads .env.local. Live push from a laptop additionally needs
# PUSH_PROVIDER=live in the shell. The worker renders the demo family's images on start while
# SEED_DEMO_FAMILY=true (.env.dev).
name: littlelight-dev

x-dev: &dev
  env_file:
    - path: .env.dev
      required: true
    - path: .env.local
      required: false

# Dev-only shared literals (never real secrets). `environment:` beats env_file, so these cannot
# be overridden from .env.local; change them here and every side follows.
x-dev-shared:
  jwt-secret: &dev-jwt-secret dev-only-jwt-secret-at-least-32-characters
  # MinIO root: storage and storage-init only (also what host-side tests/`mc` use).
  s3-root-user: &dev-s3-root-user dev
  s3-root-password: &dev-s3-root-password devdevdev
  s3-bucket: &dev-s3-bucket littlelight-dev
  # Bucket-scoped MinIO users created by storage-init (docker/minio/policy-*.json); api and
  # worker each get only their own pair, as S3_ACCESS_KEY / S3_SECRET_KEY.
  s3-api-access-key: &dev-s3-api-access-key littlelight-api
  s3-api-secret-key: &dev-s3-api-secret-key dev-api-s3-secret-16
  s3-worker-access-key: &dev-s3-worker-access-key littlelight-worker
  s3-worker-secret-key: &dev-s3-worker-secret-key dev-worker-s3-secret-16
  # db-init (and migrate, which re-runs the idempotent bootstrap) sets these login passwords;
  # each service logs in with the matching URL below.
  superuser-db-url: &dev-superuser-db-url postgres://postgres:dev@db:5432/littlelight
  auth-db-password: &dev-auth-db-password dev
  auth-db-url: &dev-auth-db-url postgres://supabase_auth_admin:dev@db:5432/littlelight
  api-db-password: &dev-api-db-password dev
  api-db-url: &dev-api-db-url postgres://littlelight_api:dev@db:5432/littlelight
  worker-db-password: &dev-worker-db-password dev
  worker-db-url: &dev-worker-db-url postgres://littlelight_worker:dev@db:5432/littlelight
  # pgcrypto key for GPS / home coordinates (migrate's seed, api, worker). Dev-only literal.
  data-encryption-key: &dev-data-encryption-key dev-only-data-encryption-key-32-chars-min
  # Public origin. GoTrue signs JWTs with iss = <public-url>/auth and the API verifies exactly
  # that issuer, so these two must change together (they are not overridable from .env.local).
  public-url: &dev-public-url http://localhost:${WEB_PORT:-8080}
  auth-issuer: &dev-auth-issuer http://localhost:${WEB_PORT:-8080}/auth
  # Host in presigned URLs (api signer; worker config). For a phone on the LAN put
  # S3_PUBLIC_ENDPOINT=http://<laptop-lan-ip>:9000 in the shell or the git-ignored `.env`.
  s3-public-endpoint: &dev-s3-public-endpoint ${S3_PUBLIC_ENDPOINT:-http://localhost:${STORAGE_PORT:-9000}}
  # Mailpit (SMTP :1025, no auth). GoTrue (codes) and the API (invites, new-device alerts)
  # send from the same address.
  smtp-host: &dev-smtp-host mail
  smtp-port: &dev-smtp-port "1025"
  mail-from: &dev-mail-from noreply@littlelight.local
  # Social sign-in: off unless exported in the shell (see the header). One flag per provider
  # feeds GoTrue (GOTRUE_EXTERNAL_*_ENABLED) and the API (AUTH_*_ENABLED, shows the button).
  apple-enabled: &dev-apple-enabled ${GOTRUE_EXTERNAL_APPLE_ENABLED:-false}
  google-enabled: &dev-google-enabled ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}

# Everything the bootstrap needs (db-init, migrate).
x-dev-bootstrap-env: &dev-bootstrap-env
  DATABASE_URL: *dev-superuser-db-url
  AUTH_DB_PASSWORD: *dev-auth-db-password
  API_DB_PASSWORD: *dev-api-db-password
  WORKER_DB_PASSWORD: *dev-worker-db-password

# db-init and migrate run the same image (packages/db/Dockerfile), built once.
x-dev-db-tools: &dev-db-tools
  image: littlelight-dev-db-tools
  build:
    context: .
    dockerfile: packages/db/Dockerfile
  restart: "no"

# api and worker: verify GoTrue JWTs with the value auth uses and share the bucket name; each
# adds its own DATABASE_URL (app role, never the superuser) and its own MinIO key pair (never root).
x-dev-app-env: &dev-app-env
  JWT_SECRET: *dev-jwt-secret
  GOTRUE_JWT_SECRET: *dev-jwt-secret
  S3_BUCKET: *dev-s3-bucket
  S3_PUBLIC_ENDPOINT: *dev-s3-public-endpoint
  DATA_ENCRYPTION_KEY: *dev-data-encryption-key

# AI provider keys (docs/plans/step-6.md 2.1, docs/plans/step-7.md 2.11). .env.local is an
# env_file of migrate, api, worker and web, so a key put there would reach all four; these
# blanks (`environment:` beats env_file) strip it where it does not belong. The apps treat "" as
# unset.
#   worker  OPENAI_API_KEY + ANTHROPIC_API_KEY   (no blanks)
#   api     OPENAI_API_KEY only                  (*dev-no-anthropic-key)
#   migrate, web: neither                        (*dev-no-ai-keys)
x-dev-no-ai-keys: &dev-no-ai-keys
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

x-dev-no-anthropic-key: &dev-no-anthropic-key
  ANTHROPIC_API_KEY: ""

# Push credentials (docs/plans/step-9.md 2.8): worker only. Blanked on api, migrate and web so a
# key put in .env.local reaches nothing else. PUSH_PROVIDER is not blanked: it is never in an
# env_file here (worker `environment:` only), so the other services simply don't have it.
x-dev-no-push-keys: &dev-no-push-keys
  APNS_TEAM_ID: ""
  APNS_KEY_ID: ""
  APNS_PRIVATE_KEY_BASE64: ""
  APNS_BUNDLE_ID: ""
  APNS_ENVIRONMENT: ""
  FCM_PROJECT_ID: ""
  FCM_SERVICE_ACCOUNT_BASE64: ""
  PUSH_APNS_BASE_URL: ""
  PUSH_FCM_BASE_URL: ""
  PUSH_OAUTH_TOKEN_URL: ""

# Store-review sign-in (docs/plans/step-9.md 2.5, D4): api only, off unless both are set (in
# .env.local for dev). Blanked on worker, migrate and web.
x-dev-no-review-account: &dev-no-review-account
  REVIEW_ACCOUNT_EMAIL: ""
  REVIEW_ACCOUNT_CODE_HASH: ""

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: littlelight
    volumes:
      - dev-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # TCP (-h 127.0.0.1) so the check can't pass against initdb's socket-only temp server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d littlelight"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # One-shot: Postgres roles (supabase_auth_admin, littlelight_api, littlelight_worker, viewer,
  # pipeline, ...), the auth schema GoTrue needs, and the pgboss schema. Idempotent; it converges
  # passwords and role attributes on every start. Must finish before GoTrue starts.
  db-init:
    <<: *dev-db-tools
    command: ["pnpm", "db:bootstrap"]
    environment:
      <<: *dev-bootstrap-env
      NODE_ENV: development
    volumes:
      - ./packages/db/src:/repo/packages/db/src:ro
    depends_on:
      db:
        condition: service_healthy

  # One-shot: app migrations + idempotent demo-family seed. Runs after GoTrue is healthy, i.e.
  # after GoTrue's own migrations created auth.users (the app tables reference it).
  # Set SEED_DEMO_FAMILY=false in .env.local to skip the seed.
  # Operator tools run in this image too, e.g. the paid-tier switch (docs/plans/step-6.md D7):
  #   docker compose -f docker-compose.dev.yml run --rm migrate pnpm db:plan <babyId> plus|free
  migrate:
    <<: [*dev, *dev-db-tools]
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    environment:
      <<: [*dev-bootstrap-env, *dev-no-ai-keys, *dev-no-push-keys, *dev-no-review-account]
      DATA_ENCRYPTION_KEY: *dev-data-encryption-key
    volumes:
      - ./packages/db/src:/repo/packages/db/src:ro
      - ./packages/db/migrations:/repo/packages/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy

  auth:
    image: supabase/auth:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: *dev-auth-db-url
      GOTRUE_JWT_SECRET: *dev-jwt-secret
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: *dev-auth-issuer
      GOTRUE_SITE_URL: *dev-public-url
      API_EXTERNAL_URL: *dev-auth-issuer
      # OAuth redirect_to targets (the SPA's /signin/callback).
      GOTRUE_URI_ALLOW_LIST: http://localhost:${WEB_PORT:-8080}/**
      GOTRUE_LOG_LEVEL: info
      # Passwordless only: email codes (+ Apple/Google when enabled). No phone, no anonymous users.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # Email OTP: 6 digits, valid 10 minutes (PRD "Accounts and authentication"); the magic-link
      # token_hash in the same email shares this expiry.
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      # Sessions (PRD "Sessions and tokens", docs/plans/step-3.md 2.2): access JWT 1 h (above),
      # refresh tokens rotate on every use and reusing an old one (outside a 10 s grace window for
      # concurrent tabs) revokes the session family; sessions expire after 90 days without a
      # refresh (native bound; the web cookie's 30-day Max-Age is the shorter web bound); many
      # devices per user.
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      # Refresh algorithm v2 (supabase/auth v2.197.0 internal/tokens/service.go): new sessions get
      # HMAC-signed counter tokens, and reusing one more than one step behind the current counter
      # outside the reuse interval DELETEs the auth.sessions row (so the API's liveness check 401s
      # the session's access tokens at once). v1 only marked refresh_tokens revoked and left the
      # session alive. The immediately previous token stays redeemable (GoTrue's "fail-to-save"
      # tolerance; it re-issues the current token without advancing the counter). Upgrade 100 %
      # moves any v1 session to v2 on its next refresh.
      GOTRUE_SECURITY_REFRESH_TOKEN_ALGORITHM_VERSION: "2"
      GOTRUE_SECURITY_REFRESH_TOKEN_UPGRADE_PERCENTAGE: "100"
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: 2160h
      GOTRUE_SESSIONS_SINGLE_PER_USER: "false"
      # Per-IP limits key on the client IP the API forwards (it calls GoTrue directly, so this is
      # its first X-Forwarded-For value). The PRD's per-email/per-IP limits live in the API; dev
      # raises GoTrue's own per-IP limits (default 30 per 5 min) so e2e runs and repeated smoke
      # runs from one machine test the API's limits, not GoTrue's.
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      GOTRUE_RATE_LIMIT_OTP: "1000"
      GOTRUE_RATE_LIMIT_VERIFY: "1000"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "1000"
      GOTRUE_RATE_LIMIT_SSO: "1000"
      # All dev mail goes to Mailpit (UI/API at http://localhost:8025). No SMTP auth in dev.
      GOTRUE_SMTP_HOST: *dev-smtp-host
      GOTRUE_SMTP_PORT: *dev-smtp-port
      GOTRUE_SMTP_ADMIN_EMAIL: *dev-mail-from
      GOTRUE_SMTP_SENDER_NAME: Littlelight
      # Dev only: effectively no email throttling (production: 60 s per address, 200/h total).
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      # Templates show the 6-digit {{ .Token }} plus a web-only fallback link to
      # /signin/callback#token_hash=...; served by the web (Vite) service. No URLPATHS settings:
      # the templates don't use {{ .ConfirmationURL }} (GoTrue's /verify is not browser-facing).
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://web:8080/email-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://web:8080/email-templates/magic-link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your Littlelight sign-in code
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your Littlelight sign-in code
      # Social sign-in (off by default; see the header). Verified-email auto-linking is GoTrue's
      # default; unverified provider emails are never linked.
      GOTRUE_EXTERNAL_APPLE_ENABLED: *dev-apple-enabled
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: http://localhost:${WEB_PORT:-8080}/auth/callback
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: *dev-google-enabled
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:${WEB_PORT:-8080}/auth/callback
    depends_on:
      db-init:
        condition: service_completed_successfully
      mail:
        condition: service_started
    ports:
      - "127.0.0.1:${AUTH_PORT:-9999}:9999"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  storage:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: *dev-s3-root-user
      MINIO_ROOT_PASSWORD: *dev-s3-root-password
      # Browser part PUTs / signed GETs to $STORAGE_PORT are cross-origin. Any origin in dev, so
      # any WEB_PORT and a phone on the LAN (http://<laptop-ip>:<WEB_PORT>) work too; production
      # allows only PUBLIC_URL.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - dev-s3:/data
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 1s

  # One-shot, idempotent (docker/minio/init.sh, same script as production): bucket with
  # versioning, the noncurrent-version lifecycle rule, and the littlelight-api /
  # littlelight-worker users with their bucket-scoped policies. The only root-key consumer
  # besides storage. Inspect with, e.g.:
  #   docker compose -f docker-compose.dev.yml run --rm --entrypoint sh storage-init -c \
  #     'mc alias set local http://storage:9000 dev devdevdev >/dev/null && mc admin user info local littlelight-api'
  storage-init:
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    restart: "no"
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_ROOT_USER: *dev-s3-root-user
      S3_ROOT_PASSWORD: *dev-s3-root-password
      S3_BUCKET: *dev-s3-bucket
      S3_API_ACCESS_KEY: *dev-s3-api-access-key
      S3_API_SECRET_KEY: *dev-s3-api-secret-key
      S3_WORKER_ACCESS_KEY: *dev-s3-worker-access-key
      S3_WORKER_SECRET_KEY: *dev-s3-worker-secret-key
    volumes:
      - ./docker/minio:/minio:ro
    entrypoint: ["/bin/bash", "/minio/init.sh"]
    depends_on:
      storage:
        condition: service_healthy

  mail:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s

  api:
    <<: *dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "@littlelight/api", "dev"]
    init: true
    environment:
      <<: [*dev-app-env, *dev-no-anthropic-key, *dev-no-push-keys]
      DATABASE_URL: *dev-api-db-url
      # Bucket-scoped MinIO user (no delete, no versions, no admin); see storage-init.
      S3_ACCESS_KEY: *dev-s3-api-access-key
      S3_SECRET_KEY: *dev-s3-api-secret-key
      # tsx watch (4.23.15 bundles chokidar 3, which reads CHOKIDAR_USEPOLLING/CHOKIDAR_INTERVAL):
      # poll the bind-mounted sources, because inotify events from Docker Desktop's host file
      # sharing are not reliable (an edit was missed). node_modules and dotfiles are ignored by
      # tsx, so only the imported source graph is polled. Override from the shell if needed.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-1}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-500}
      # Auth + mail (docs/plans/step-3.md 2.8). The api is the only app service with SMTP; the
      # worker gets none. AUTH_INTERNAL_URL and the optional TURNSTILE_* keys come from .env.dev /
      # .env.local; these must match GoTrue, so they are pinned here.
      PUBLIC_URL: *dev-public-url
      AUTH_APPLE_ENABLED: *dev-apple-enabled
      AUTH_GOOGLE_ENABLED: *dev-google-enabled
      SMTP_HOST: *dev-smtp-host
      SMTP_PORT: *dev-smtp-port
      SMTP_SECURE: "false"
      MAIL_FROM: *dev-mail-from
      # Search + chat (docs/plans/step-7.md 2.9, 2.11). OPENAI_API_KEY comes from .env.local (no
      # key => "AI disabled: ..." at boot, keyword-only search, chat answers 409 "not
      # configured"); CHAT_*, EMBED_* and SEARCH_* come from .env.dev / .env.local.
      # VISION_PROVIDER is the same Compose INTERPOLATION variable as on the worker (shell or the
      # git-ignored project `.env`, not .env.local); `fake` selects the fake chat model and the
      # fake embedder here (no key, no network):
      #   VISION_PROVIDER=fake docker compose -f docker-compose.dev.yml up -d --no-deps api worker
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      # Sharing (docs/plans/step-8.md 2.11): lifetime of share-link viewers' presigned media URLs
      # (30-900 s). Compose INTERPOLATION like VISION_PROVIDER, so the share gate can recreate
      # the api with short-lived URLs and a plain `up` puts it back on 300:
      #   SHARE_MEDIA_URL_TTL_SEC=30 docker compose -f docker-compose.dev.yml up -d --no-deps api
      # The worker's SHARE_RECONCILE_CRON comes from .env.dev / .env.local.
      SHARE_MEDIA_URL_TTL_SEC: ${SHARE_MEDIA_URL_TTL_SEC:-300}
      # Native apps (docs/plans/step-9.md 2.3, 2.8). NATIVE_APP_ORIGINS (CORS allow-list) comes
      # from .env.dev / .env.local. The api enqueues share_viewed pushes with this delay (s);
      # Compose INTERPOLATION, same value as the worker's (see the worker block). No other push
      # setting and no APNs/FCM credential reaches the api (*dev-no-push-keys). The store-review
      # account (REVIEW_ACCOUNT_EMAIL + REVIEW_ACCOUNT_CODE_HASH, off unless both set) is read
      # from .env.local by this service only.
      PUSH_SHARE_DEBOUNCE_SEC: ${PUSH_SHARE_DEBOUNCE_SEC:-60}
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./packages/shared/src:/repo/packages/shared/src
      - ./packages/ai/src:/repo/packages/ai/src
      - ./packages/db/src:/repo/packages/db/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  worker:
    <<: *dev
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "@littlelight/worker", "dev"]
    init: true
    environment:
      <<: [*dev-app-env, *dev-no-review-account]
      DATABASE_URL: *dev-worker-db-url
      # Bucket-scoped MinIO user (api's rights + delete incl. object versions; no admin).
      S3_ACCESS_KEY: *dev-s3-worker-access-key
      S3_SECRET_KEY: *dev-s3-worker-secret-key
      # photo.ingest jobs per worker process (each may hold one decoded image); export
      # INGEST_CONCURRENCY in the shell before `up` to change it.
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
      # Disk-usage alert (heartbeat statfs; STORAGE_DISK_ALERT_PCT defaults to 80, override in
      # .env.local): dev-s3 mounted read-only below.
      STORAGE_DISK_PATH: /storage
      # tsx watch (4.23.15 bundles chokidar 3, which reads CHOKIDAR_USEPOLLING/CHOKIDAR_INTERVAL):
      # poll the bind-mounted sources, because inotify events from Docker Desktop's host file
      # sharing are not reliable (an edit was missed). node_modules and dotfiles are ignored by
      # tsx, so only the imported source graph is polled. Override from the shell if needed.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-1}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-500}
      # AI batch pipeline + search indexer (docs/plans/step-6.md 2.10, D6; docs/plans/step-7.md
      # 2.11). The worker gets OPENAI_API_KEY / ANTHROPIC_API_KEY from .env.local (the api gets
      # OPENAI_API_KEY too; without a key AI and embeddings are skipped with a log line and
      # nothing fails). The other AI_* / EMBED_* / SEARCH_* settings come from .env.dev /
      # .env.local. These two are Compose INTERPOLATION variables (like INGEST_CONCURRENCY):
      # export them in the shell or put them in the git-ignored project `.env`; .env.local cannot
      # change them, because `environment:` beats env_file even when the value is empty. Keyless
      # full run (fake provider, flush on every 5-minute tick); recreate the api too so chat and
      # query embeddings use the same fake provider:
      #   VISION_PROVIDER=fake AI_BATCH_FLUSH_MINUTES=0 \
      #     docker compose -f docker-compose.dev.yml up -d --no-deps api worker
      # A plain `up` afterwards puts both back on openai (and the worker on 30 minutes).
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      AI_BATCH_FLUSH_MINUTES: ${AI_BATCH_FLUSH_MINUTES:-30}
      # Fake provider only: request lines minus image bytes (photo ids, context field lengths),
      # read by `pnpm e2e:ai-gate --provider fake` via `docker compose exec worker cat`.
      FAKE_VISION_DIR: /tmp/littlelight-fake-vision
      # Push notifications (docs/plans/step-9.md 2.8), worker only. Compose INTERPOLATION
      # variables (shell or the git-ignored project `.env`; .env.local cannot change them):
      #   PUSH_PROVIDER             fake (default: logs {kind, provider}, sends nothing) | none |
      #                             live (APNs/FCM; needs APNS_* / FCM_* in .env.local)
      #   PUSH_PHOTOS_DEBOUNCE_SEC  delay before a photos_analyzed push (600)
      #   PUSH_SHARE_DEBOUNCE_SEC   delay before a share_viewed push (60; the api uses it too)
      #   PUSH_MIN_GAP_MIN          at most one push per baby + kind per user per this gap (60)
      # The push gate recreates api + worker with all three at 0 (see the header); a plain `up`
      # puts them back. APNS_* / FCM_* / PUSH_*_BASE_URL come from .env.local (empty = unset).
      PUSH_PROVIDER: ${PUSH_PROVIDER:-fake}
      PUSH_PHOTOS_DEBOUNCE_SEC: ${PUSH_PHOTOS_DEBOUNCE_SEC:-600}
      PUSH_SHARE_DEBOUNCE_SEC: ${PUSH_SHARE_DEBOUNCE_SEC:-60}
      PUSH_MIN_GAP_MIN: ${PUSH_MIN_GAP_MIN:-60}
      # Demo media (docs/plans/step-9.md 2.11): with SEED_DEMO_FAMILY=true (.env.dev) the worker
      # renders the seeded demo photos' originals + derivatives into MinIO on start (dev only,
      # idempotent, never blocks readiness). The store-review account is api-only
      # (*dev-no-review-account).
    volumes:
      - ./apps/worker/src:/repo/apps/worker/src
      - ./packages/shared/src:/repo/packages/shared/src
      - ./packages/ai/src:/repo/packages/ai/src
      # MinIO's data volume, read-only, only for statfs (disk alert); objects go through S3.
      - type: volume
        source: dev-s3
        target: /storage
        read_only: true
        volume:
          nocopy: true
    # Same cap as production: two concurrent 48 MP HEIC decodes are ~800 MB RSS.
    mem_limit: 2g
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      # Own heartbeat row fresh within HEARTBEAT_STALE_MS (only advanced while storage is reachable).
      test: ["CMD", "pnpm", "--silent", "--filter", "@littlelight/worker", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 2
      start_period: 90s
      start_interval: 3s

  web:
    <<: *dev
    build:
      context: .
      dockerfile: apps/mobile-web/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "@littlelight/mobile-web", "dev", "--host", "0.0.0.0", "--port", "8080"]
    init: true
    environment:
      <<: [*dev-no-ai-keys, *dev-no-push-keys, *dev-no-review-account]
    volumes:
      - ./apps/mobile-web/src:/repo/apps/mobile-web/src
      - ./packages/shared/src:/repo/packages/shared/src
      # GoTrue fetches its email templates from http://web:8080/email-templates/*.
      - ./docker/gotrue/templates:/repo/apps/mobile-web/public/email-templates:ro
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

volumes:
  dev-db:
  dev-s3:
