# Tinyglow production web server (image: apps/mobile-web/Dockerfile, target prod).
# Reached only through Cloudflare Tunnel: tinyglow.app -> host-run cloudflared ->
# ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-6987} (published by docker-compose.yml) -> :80 here. Client IP: no
# real_ip config on purpose; CF-Connecting-IP (set by Cloudflare) is passed through unchanged to
# api and auth, which rate-limit on it. When it is absent (LAN or host traffic that bypassed
# Cloudflare), nginx sets it to $remote_addr ($ll_client_ip below, docs/plans/review-fixes.md
# D10), so such clients are rate-limited per peer instead of all sharing one empty key. A client
# that reaches the published port without Cloudflare can still send its own CF-Connecting-IP:
# keep WEB_BIND on loopback or firewalled to the cloudflared host (.env.example, "Cloudflare
# Tunnel"). The api trusts exactly one proxy hop (trustProxy: 1) for X-Forwarded-For.
# Content-Security-Policy: Report-Only by default, from the one templated file
# docker/nginx/templates/csp.conf.template (rendered to /etc/nginx/snippets/csp.conf at start;
# WEB_CSP_HEADER switches it to enforcing). Everything else here is static.
# Routes (docs/plans/step-1.md 2.4, docs/plans/step-3.md 2.1/2.8; the Vite dev proxy matches):
#   /api/*   -> http://api:3000/*   (prefix stripped)
#   /auth/health (GET), /auth/authorize (GET), /auth/callback (GET, POST)
#            -> http://auth:9999/*  (prefix stripped). Every other /auth/* path is 404: the API
#               is GoTrue's only client for OTP/verify/token/logout/user/admin (it applies the
#               per-email/IP limits, Turnstile, generic responses, audit and cookies), and no
#               password endpoint (/signup, /token?grant_type=password, /recover) is reachable.
#   /.well-known/*, /email-templates/*, SPA fallback, /healthz
#   /s/<token> share-link viewer page: SPA shell with no-referrer, no-store, noindex (step 8)
# Chat streaming (docs/plans/step-7.md 2.8, 2.11): POST /api/babies/<id>/chat/messages answers
# with Server-Sent Events. Only that path is unbuffered (nested location under /api/); every
# other API response keeps nginx's default buffering.

# Cloudflare sets X-Forwarded-Proto: https at the edge; keep it, else use our own scheme.
map $http_x_forwarded_proto $ll_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Client IP for rate limits: Cloudflare's header when present, else the TCP peer.
map $http_cf_connecting_ip $ll_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Cache policy by response type: hashed Vite assets for a year, HTML/other always revalidated.
# Uses `expires` (not add_header) so the server-level security headers below are inherited.
map $sent_http_content_type $ll_expires {
    default                     -1;
    ~*application/javascript    1y;
    ~*text/css                  1y;
    ~*font/                     1y;
}

# Browser-facing GoTrue allow-list (method + normalised path; $uri has ../ and // resolved, so
# /auth/health/../otp is /auth/otp and is refused).
map "$request_method $uri" $ll_auth_allowed {
    default                                         0;
    "~^GET /auth/(?:health|authorize|callback)$"    1;
    "POST /auth/callback"                           1;
}

# Access log without query strings, referers or bearer-like path segments: the original request
# path (before /api and /auth prefix stripping), query cut off. Query strings carry OAuth
# codes/state (/auth/callback?code=, /signin/callback?code=); invite and share tokens are path
# segments (/invite/<token>, /api/invites/<token>[/accept], /s/<token>, /api/s/...). The
# share token in /api/share/manifest.webmanifest?t=<token> goes with the query string; the
# viewer's token exchange (POST /api/share/session) carries it in the body, which is never
# logged. The magic-link token_hash travels in the URL fragment, which browsers never send.
map $request_uri $ll_log_path {
    default                                                             $uri;
    "~^(?<ll_pfx>/(?:api/)?(?:invites?|s)/)[^/?]+(?<ll_sfx>[^?]*)"      "${ll_pfx}:token${ll_sfx}";
    "~^(?<ll_path>[^?]*)"                                               $ll_path;
}
log_format ll_main '$remote_addr [$time_local] "$request_method $ll_log_path $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log ll_main;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams are variables so nginx starts without api/auth up and
    # re-resolves after they restart (a recreated container gets a new IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Default for non-API paths; /api/ raises it below.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    include /etc/nginx/snippets/csp.conf;

    # Container healthcheck (Dockerfile HEALTHCHECK). Not proxied anywhere.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
        set $ll_api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $ll_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ll_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header CF-Connecting-IP $ll_client_ip;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Cloudflare caps request bodies at 100 MB (Free/Pro). Photo bytes go straight to MinIO
        # via pre-signed multipart URLs (files.tinyglow.app) in parts <= 50 MB;
        # nothing larger than a part should ever reach the API.
        # Videos (docs/plans/step-12.md 2.10) change nothing here: their bytes also bypass nginx
        # (16 MiB part PUTs to files.*, and playback is MinIO range requests on the MP4 rendition
        # via files.*); the API only sees small JSON (register, parts, complete), so this limit
        # and the 300 s timeouts stay as they are.
        client_max_body_size 50m;
        proxy_request_buffering off;

        # Chat SSE stream. Nested, so it inherits every proxy_set_header above (including
        # Connection "" for upstream keepalive), proxy_http_version 1.1 and the 300 s send
        # timeout; `set`/`rewrite`/`proxy_pass` are not inherited by nested locations and are
        # repeated. Unbuffered and uncached so each event reaches the client as the api writes
        # it (the api also sends X-Accel-Buffering: no); responses go out chunked over HTTP/1.1.
        # 180 s read timeout = the longest gap nginx tolerates between upstream writes; the api
        # writes a keepalive comment every 15 s, which also keeps Cloudflare's 100 s proxy read
        # timeout from firing.
        location ~ ^/api/babies/[^/]+/chat/messages$ {
            set $ll_api http://api:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $ll_api;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
            chunked_transfer_encoding on;
            # Compressing an event stream would hold events back in the gzip buffer.
            gzip off;
            # Chat messages are <= 1,000 characters of JSON.
            client_max_body_size 64k;
        }

        # API paths that carry a bearer-like token in the URL: invites (/api/invites/<token>
        # [/accept]) and the share-link PWA manifest (/api/share/manifest.webmanifest?t=<token>).
        # The access log masks them ($ll_log_path), but nginx's ERROR log prints the raw request
        # line (path + query) on upstream failures ("api could not be resolved", 502/504), so
        # only `crit` and above are logged here; the access log still records the status, and
        # the api logs its own errors with redacted URLs. Same proxy settings as /api/ (the
        # proxy_set_header lines are inherited; set/rewrite/proxy_pass are not).
        location ~ ^/api/(?:invites?/|share/manifest\.webmanifest$) {
            error_log /var/log/nginx/error.log crit;
            set $ll_api http://api:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $ll_api;
        }
    }

    # ---- GoTrue (OAuth redirects + health only; see $ll_auth_allowed) -------
    location /auth/ {
        # `if` + `return` is the safe use of `if` inside a location.
        if ($ll_auth_allowed = 0) {
            return 404;
        }

        set $ll_auth http://auth:9999;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $ll_auth;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ll_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_set_header CF-Connecting-IP $ll_client_ip;

        # Apple's form_post callback is a small urlencoded body.
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # ---- Deep-link association files (invite / share / auth callback) --------
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        expires 1h;
        try_files $uri =404;
    }

    location /.well-known/ {
        default_type application/json;
        expires 1h;
        try_files $uri =404;
    }

    # ---- GoTrue email templates (fetched by the auth container over HTTP) ----
    location /email-templates/ {
        expires -1;
        try_files $uri =404;
    }

    # ---- Hashed Vite build output: cache for a year, never fall back to index.html ----
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ---- Share-link viewer page: /s/<token> (docs/plans/step-8.md 2.11, FR-9.6) ----------
    # Always the SPA shell (never a static file under /s/), with:
    #   - Referrer-Policy no-referrer: the token is in this document's URL, so no request made
    #     from it (assets, /api/share/*, files.* presigned GETs, outbound links) may carry it in
    #     a Referer header.
    #   - Cache-Control no-store: the viewer HTML is never kept by the browser, Cloudflare or any
    #     other cache (a revoked link must not reopen from a cache).
    #   - X-Robots-Tag noindex: private albums never appear in search engines.
    # nginx 1.28 drops ALL server-level add_header lines in a location that declares its own,
    # so the other three server-level security headers and the CSP snippet are repeated here;
    # keep them in sync.
    # The token never reaches the access log: $ll_log_path above logs /s/:token.
    # The SPA exchanges the token with POST /api/share/session (body, not path) through the
    # /api/ block above; the per-link PWA manifest (GET /api/share/manifest.webmanifest?t=...)
    # is proxied there too, so its Content-Type (application/manifest+json) and
    # Cache-Control: no-store come from the api unchanged and its query string is not logged.
    location ^~ /s/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        include /etc/nginx/snippets/csp.conf;
        try_files /index.html =404;
    }

    # ---- SPA ---------------------------------------------------------------
    location / {
        expires $ll_expires;
        try_files $uri $uri/ /index.html;
    }
}
