# Littlelight production web server (image: apps/mobile-web/Dockerfile, target prod).
# Reached only through Cloudflare Tunnel: littlelight.tesarsoft.com -> http://web:80.
# Routes (docs/plans/step-1.md 2.4, identical to the Vite dev proxy):
#   /api/*   -> http://api:3000/*   (prefix stripped)
#   /auth/*  -> http://auth:9999/*  (prefix stripped)
#   /.well-known/*, /email-templates/*, SPA fallback, /healthz

# Cloudflare sets X-Forwarded-Proto: https at the edge; keep it, else use our own scheme.
map $http_x_forwarded_proto $ll_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Cache policy by response type: hashed Vite assets for a year, HTML/other always revalidated.
# Uses `expires` (not add_header) so the server-level security headers below are inherited.
map $sent_http_content_type $ll_expires {
    default                     -1;
    ~*application/javascript    1y;
    ~*text/css                  1y;
    ~*font/                     1y;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams are variables so nginx starts without api/auth up and
    # re-resolves after they restart (a recreated container gets a new IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Default for non-API paths; /api/ raises it below.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    # Container healthcheck (Dockerfile HEALTHCHECK). Not proxied anywhere.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
        set $ll_api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $ll_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ll_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;

        # SSE (chat streaming, step 7) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Cloudflare caps request bodies at 100 MB (Free/Pro). Photo bytes go straight to MinIO
        # via pre-signed multipart URLs (files.littlelight.tesarsoft.com) in parts <= 50 MB;
        # nothing larger than a part should ever reach the API.
        client_max_body_size 50m;
        proxy_request_buffering off;
    }

    # ---- GoTrue ------------------------------------------------------------
    location /auth/ {
        set $ll_auth http://auth:9999;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $ll_auth;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ll_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /auth;

        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # ---- Deep-link association files (invite / share / auth callback) --------
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        expires 1h;
        try_files $uri =404;
    }

    location /.well-known/ {
        default_type application/json;
        expires 1h;
        try_files $uri =404;
    }

    # ---- GoTrue email templates (fetched by the auth container over HTTP) ----
    location /email-templates/ {
        expires -1;
        try_files $uri =404;
    }

    # ---- Hashed Vite build output: cache for a year, never fall back to index.html ----
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ---- SPA ---------------------------------------------------------------
    location / {
        expires $ll_expires;
        try_files $uri $uri/ /index.html;
    }
}
